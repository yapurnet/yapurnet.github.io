<script>
/* ===== Adaptaciones de la app Android (no hacen nada fuera de la app) ===== */
// El PDF se entrega al guardado nativo (descarga + menú de compartir). Si se está enviando
// el mail al instructor, se espera a que termine para que el menú de compartir no
// interrumpa el envío (la pantalla de "enviando" pide no cambiar de aplicación).
var __pdfPendienteApp = null;
function vaciarPdfPendienteApp(){
  var f = __pdfPendienteApp; __pdfPendienteApp = null;
  if (f) { try { f(); } catch (e) { console.error(e); } }
}
function entregarPdfApp(nombre, b64){
  function guardar(){
    if (typeof window.AndroidBridge.savePdfBase64 === 'function') window.AndroidBridge.savePdfBase64(nombre, b64);
    else window.AndroidBridge.postMessage(JSON.stringify({ action: 'savePdf', filename: nombre, data: b64 }));
  }
  var enviando = (typeof RESULTS_ENDPOINT !== 'undefined' && RESULTS_ENDPOINT) &&
                 (typeof ENVIAR_PDF_AL_INSTRUCTOR !== 'undefined' && ENVIAR_PDF_AL_INSTRUCTOR);
  if (!enviando) { guardar(); return; }
  __pdfPendienteApp = guardar;
  setTimeout(vaciarPdfPendienteApp, 100000);   // red de seguridad: nunca se pierde el PDF
}
(function(){
  if (!window.AndroidBridge) return;
  // cuando termina el envío (bien, mal o por tiempo agotado) se entrega el PDF
  var _terminarOrig = window.envioTerminar;
  window.envioTerminar = function(){
    try { return _terminarOrig.apply(this, arguments); }
    finally { setTimeout(vaciarPdfPendienteApp, 400); }
  };
  // Instructores: en la app se guardan en el propio celular (no hay archivo que reemplazar)
  window.hayCambiosSinArchivo = function(){ return false; };
  window.pintarEstadoGuardado = function(){
    var box = document.getElementById('estadoGuardadoInstr'); if (!box) return;
    box.innerHTML = ''; box.className = 'iestado ok';
    var t = document.createElement('b'); t.textContent = '✔ Guardado en la app.'; box.appendChild(t);
    var d = document.createElement('small');
    d.textContent = 'Los instructores y sus correos quedan guardados en este celular y se conservan al actualizar la app.';
    box.appendChild(d);
  };
  // "Descargar una copia del examen" no aplica dentro de la app
  try {
    var b = document.querySelector('button[onclick="guardarCopiaConInstructores()"]');
    if (b) { var p = b.previousElementSibling; if (p && p.tagName === 'P') p.style.display = 'none'; b.style.display = 'none'; }
  } catch (e) {}
})();
</script><script>
/* ===== Actualización automática de instructores (solo dentro de la app) =====
   Al abrir la app (y al volver a ella) se baja la lista publicada en GitHub. Si es más nueva que la que
   tiene la app, reemplaza la lista "de fábrica"; los instructores cargados a mano en este celular se
   conservan. Si no hay internet se sigue usando la última lista bajada (o la que trae la app). */
(function(){
  if (!window.AndroidBridge) return;
  var URL_LISTA = '__FAVL_SITE__/favl-instructores.json';
  var VERSION_APP = __FAVL_INSTR_VERSION__;            // marca de tiempo de la lista que trae esta app
  var LS_CACHE = 'favlInstrRemotoV1';
  var aplicada = VERSION_APP;                           // versión de la lista que se está usando
  var ultimoIntento = 0, enCurso = false;

  function ls(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  // Valida y limpia una lista que viene de internet. Devuelve null si algo no cierra.
  function validar(lista){
    if (!Array.isArray(lista) || !lista.length || lista.length > 60) return null;
    var out = [], ids = {};
    for (var n = 0; n < lista.length; n++) {
      var i = lista[n];
      if (!i || typeof i.id !== 'string' || !/^[A-Za-z0-9_-]{1,60}$/.test(i.id) || ids[i.id]) return null;
      if (typeof i.nombre !== 'string' || !i.nombre.trim() || i.nombre.length > 120) return null;
      if (typeof i.licencia !== 'string' || !i.licencia.trim() || i.licencia.length > 40) return null;
      if (typeof i.logo !== 'string' || i.logo.length > 3000000 || !/^data:image\/(jpeg|png|webp|gif);base64,/.test(i.logo)) return null;
      var emails = [];
      if (Array.isArray(i.emails)) i.emails.forEach(function(e){ if (typeof e === 'string' && e.length < 200) emails.push(e); });
      ids[i.id] = 1;
      out.push({ id: i.id, nombre: i.nombre.trim(), licencia: i.licencia.trim(), emails: limpiarCorreos(emails), logo: i.logo });
    }
    return out;
  }
  function firma(lista){
    return JSON.stringify(lista.map(function(i){
      return [i.id, String(i.nombre || '').trim(), String(i.licencia || '').trim(), i.logo, limpiarCorreos(i.emails || []).join(',')];
    }));
  }

  function aviso(texto){
    try {
      var d = document.createElement('div');
      d.setAttribute('role', 'status');
      d.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + var(--favl-aviso-h, 0px));transform:translateX(-50%);max-width:88vw;z-index:2147483000;' +
        'background:#12355b;color:#fff;padding:10px 16px;border-radius:12px;font:600 14px/1.35 system-ui,sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.35);text-align:center';
      d.textContent = texto;
      document.body.appendChild(d);
      setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 4500);
    } catch (e) {}
  }

  function aplicarLista(lista, version, avisar){
    var cambio = firma(lista) !== firma(INSTRUCTORES_BASE);
    // lo que este celular ya publicó y ahora llega en la lista deja de ser «local» (ver bloque de publicación)
    var absorbio = false;
    try { absorbio = !!(window.__favlAbsorber && window.__favlAbsorber(lista, version)); } catch (e) {}
    if (!cambio && absorbio) aplicarCambioInstructores(null);
    if (cambio) {
      var previos = {};
      INSTRUCTORES_BASE.forEach(function(b){ previos[b.id] = firma([b]); });
      INSTRUCTORES_BASE.length = 0;
      lista.forEach(function(i){ INSTRUCTORES_BASE.push(i); });
      // si la lista publicada cambió los datos de un instructor, vale lo nuevo (se descarta la edición local vieja de ese instructor)
      lista.forEach(function(i){
        if (previos[i.id] && previos[i.id] !== firma([i]) && cambiosInstructores.editados) delete cambiosInstructores.editados[i.id];
      });
      aplicarCambioInstructores(null);
    }
    aplicada = version;
    if (cambio && avisar) aviso('Lista de instructores actualizada');
  }

  function examenEnMarcha(){ try { return !!examenEnCurso; } catch (e) { return false; } }

  // 1) al abrir: usar la última lista bajada si es más nueva que la de la app (sirve sin internet)
  try {
    var c = JSON.parse(ls(LS_CACHE) || 'null');
    if (c && typeof c.version === 'number' && c.version > aplicada) {
      var lc = validar(c.instructores);
      if (lc) aplicarLista(lc, c.version, false);
    }
  } catch (e) {}

  // 2) con internet: bajar la lista publicada
  function sincronizar(){
    if (enCurso) return;
    enCurso = true; ultimoIntento = Date.now();
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var corte = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 20000);
    var fin = function(){ clearTimeout(corte); enCurso = false; };
    fetch(URL_LISTA, { cache: 'no-cache', signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){
        fin();
        if (!j || typeof j.version !== 'number' || j.version <= aplicada) return;
        var lista = validar(j.instructores);
        if (!lista) return;
        lsSet(LS_CACHE, JSON.stringify({ version: j.version, instructores: lista }));
        if (examenEnMarcha()) return;                 // no se toca nada con un examen en curso: se aplica en la próxima sincronización
        aplicarLista(lista, j.version, true);
      })
      .catch(function(){ fin(); });
  }

  function sincronizarSiHaceFalta(){ if (Date.now() - ultimoIntento > 5 * 60 * 1000) sincronizar(); }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) sincronizarSiHaceFalta(); });
  window.addEventListener('online', sincronizarSiHaceFalta);
  window.addEventListener('focus', sincronizarSiHaceFalta);
  setTimeout(sincronizar, 800);
  // por si el examen terminó y había una lista nueva guardada pendiente
  setInterval(function(){
    if (examenEnMarcha()) return;
    try {
      var c2 = JSON.parse(ls(LS_CACHE) || 'null');
      if (c2 && typeof c2.version === 'number' && c2.version > aplicada) {
        var l2 = validar(c2.instructores);
        if (l2) aplicarLista(l2, c2.version, true);
      }
    } catch (e) {}
  }, 30000);
})();
</script><script>
/* ===== Publicar los cambios de instructores a todos los celulares (solo dentro de la app) =====
   Al agregar, editar o quitar un instructor en el panel, la app manda el cambio a GitHub (abre un pedido
   «FAVL-INSTR» a nombre del dueño del repositorio, con su clave de GitHub). GitHub lo valida, lo aplica, publica
   la lista nueva y las demás apps la bajan solas. La clave puede venir dentro del APK (compilación con el secreto
   FAVL_ISSUES_TOKEN): entonces cualquier instructor publica sin escribir nada. Si el APK no la trae (o venció),
   se pega a mano UNA vez en el celular. Sin clave, los cambios quedan solo en este celular (como antes).
   La misma vía sirve para las claves personales de examen (una por alumno, de un solo uso).
   Sin internet, el cambio queda en cola y se envía cuando vuelve la conexión. */
(function(){
  if (!window.AndroidBridge) return;
  var REPO = '__FAVL_REPO__';
  var TOKEN_APK = '__FAVL_ISSUES_TOKEN__';       // clave que trae el APK (puede estar vacía)
  var API = 'https://api.github.com/repos/' + REPO;
  var K_TOK = 'favlGhKeyV1', K_COLA = 'favlColaPublicarV1', K_VERIF = 'favlVerificarV1',
      K_PUB = 'favlPublicadosV1', K_NO = 'favlNoPublicarV1', K_MALA = 'favlClaveApkVencidaV1', K_ERR = 'favlUltimoErrorGhV1';
  var RE_CLAVE = /^(github_pat_|gh[pousr]_)[A-Za-z0-9_]{20,255}$/;
  var SITE = '__FAVL_SITE__';
  var K_EMIT = 'favlClavesEmitidasV1', K_REG = 'favlClavesRegV1', K_CANJE = 'favlCanjeV1', K_EXIGIR = 'favlExigirLocalV1';
  var ALFA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';     // 31 caracteres, sin I, L, O, 0, 1 (no se confunden al copiar)
  var RE_CK = /^[A-HJKMNP-Z2-9]{12}$/;
  var DIAS_CK = 7;                                // vencimiento de cada clave personal
  var MAX_LOGO = 60000;                          // el cuerpo de un pedido admite 65536 caracteres

  /* ---------- almacenamiento ---------- */
  function leer(k, def){ try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? def : v; } catch (e) { return def; } }
  function guardar(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function borrar(k){ try { localStorage.removeItem(k); } catch (e) {} }
  function limpiarClave(c){ return String(c == null ? '' : c).replace(/\s+/g, ''); }
  function claveGuardada(){ var c = leer(K_TOK, ''); return (typeof c === 'string' && RE_CLAVE.test(c)) ? c : ''; }
  // la clave pegada a mano manda; si no hay, la que trae el APK (salvo que GitHub ya la haya rechazado)
  function claveDelApk(){ return RE_CLAVE.test(TOKEN_APK) && leer(K_MALA, '') !== TOKEN_APK.slice(-10) ? TOKEN_APK : ''; }
  function clave(){ return claveGuardada() || claveDelApk(); }

  function nonce(){
    var a = '', i;
    try { var u = new Uint8Array(8); (window.crypto || window.msCrypto).getRandomValues(u); for (i = 0; i < 8; i++) a += ('0' + u[i].toString(16)).slice(-2); } catch (e) { a = ''; }
    while (a.length < 16) a += Math.floor(Math.random() * 16).toString(16);
    return a;
  }

  /* ---------- avisos en pantalla ---------- */
  var toastEl = null, toastTimer = null;
  function toast(texto, tipo, fijo){
    try {
      if (!toastEl || !toastEl.parentNode) {
        toastEl = document.createElement('div');
        toastEl.setAttribute('role', 'status');
        toastEl.onclick = function(){ if (toastEl.parentNode) toastEl.parentNode.removeChild(toastEl); };
        document.body.appendChild(toastEl);
      }
      toastEl.style.cssText = 'position:fixed;left:50%;bottom:calc(20px + var(--favl-aviso-h, 0px));transform:translateX(-50%);max-width:90vw;z-index:2147483000;' +
        'color:#fff;padding:10px 16px;border-radius:12px;font:600 14px/1.35 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);' +
        'text-align:center;background:' + (tipo === 'err' ? '#7a1f16' : (tipo === 'ok' ? '#1d6b3a' : '#12355b'));
      toastEl.textContent = texto + (fijo ? '  (tocá para cerrar)' : '');
      if (toastTimer) clearTimeout(toastTimer);
      if (!fijo) toastTimer = setTimeout(function(){ if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl); }, 6000);
    } catch (e) {}
  }

  /* ---------- logo: se achica para que entre en un pedido ---------- */
  function prepararLogo(dataUrl){
    return new Promise(function(resolve, reject){
      if (!dataUrl) return resolve(null);
      if (dataUrl.length <= MAX_LOGO) return resolve(dataUrl);
      var img = new Image();
      img.onload = function(){
        try {
          var esJpg = /^data:image\/jpe?g/.test(dataUrl);
          var tamanos = [400, 300, 220, 160, 120, 90];
          for (var n = 0; n < tamanos.length; n++) {
            var esc = Math.min(1, tamanos[n] / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
            var w = Math.max(1, Math.round((img.naturalWidth || 1) * esc)), h = Math.max(1, Math.round((img.naturalHeight || 1) * esc));
            var c = document.createElement('canvas'); c.width = w; c.height = h;
            var ctx = c.getContext('2d');
            var intentos = esJpg ? [['image/jpeg', 0.85], ['image/jpeg', 0.7]] : [['image/png'], ['image/jpeg', 0.85], ['image/jpeg', 0.7]];
            for (var j = 0; j < intentos.length; j++) {
              ctx.clearRect(0, 0, w, h);
              if (intentos[j][0] === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
              ctx.drawImage(img, 0, 0, w, h);
              var out = c.toDataURL(intentos[j][0], intentos[j][1]);
              if (out.length <= MAX_LOGO && /^data:image\/(jpeg|png);base64,/.test(out)) return resolve(out);
            }
          }
          reject(new Error('logo'));
        } catch (e) { reject(e); }
      };
      img.onerror = function(){ reject(new Error('logo')); };
      img.src = dataUrl;
    });
  }

  /* ---------- API de GitHub ---------- */
  function cab(conCuerpo, tk){
    var k = tk || clave();
    var h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (k) h['Authorization'] = 'Bearer ' + k;
    if (conCuerpo) h['Content-Type'] = 'application/json';
    return h;
  }
  function errorHttp(status, msg){
    var tipo = 'red';
    if (status === 401 || status === 403) tipo = 'auth';
    else if (status === 404 || status === 410) tipo = 'repo';
    else if (status === 422 || status === 400) tipo = 'datos';
    return { tipo: tipo, status: status, msg: String(msg || '').replace(/\s+/g, ' ').slice(0, 80) };
  }
  function crearPedido(cuerpoPedido, titulo){
    return fetch(API + '/issues', { method: 'POST', headers: cab(true), body: JSON.stringify({ title: titulo, body: cuerpoPedido }) })
      .then(function(r){
        if (r.status === 201) return r.json().then(function(j){
          if (!j || typeof j.number !== 'number') throw { tipo: 'red', status: 0 };
          return { num: j.number };
        });
        // se guarda lo que contestó GitHub (por ejemplo «Bad credentials») para poder diagnosticar el problema
        return r.text().then(function(t){
          var m = ''; try { m = String(JSON.parse(t).message || ''); } catch (e) {}
          throw errorHttp(r.status, m);
        }, function(){ throw errorHttp(r.status); });
      }, function(){ throw { tipo: 'red', status: 0 }; });
  }

  /* ---------- cola de envío ---------- */
  var enviando = false, bloqueoHasta = 0, avisoRed = false, avisoAuth = false;

  function armarPedido(item){
    return prepararLogo(item.d && item.d.logo).then(function(logo){
      var datos;
      if (item.op === 'set') {
        datos = { nombre: item.d.nombre, licencia: item.d.licencia, emails: item.d.emails || [] };
        if (logo) datos.logo = logo;
      } else if (item.op.indexOf('ck-') === 0) {
        datos = item.d;
      }
      var cuerpo = JSON.stringify({ v: 1, n: item.n, t: Date.now(), op: item.op, id: item.id, d: datos });
      if (cuerpo.length > 65000) throw { tipo: 'datos', status: 0 };
      return cuerpo;
    });
  }

  function procesar(){
    if (!clave() || enviando || Date.now() < bloqueoHasta) return;
    var cola = leer(K_COLA, []);
    if (!cola.length) return;
    var item = cola[0];
    enviando = true;
    armarPedido(item)
      .then(function(cuerpo){ return crearPedido(cuerpo, 'FAVL-INSTR ' + item.op + ' ' + String(item.n).slice(0, 8)); })
      .then(function(r){
        guardar(K_COLA, leer(K_COLA, []).filter(function(x){ return x.n !== item.n; }));
        var v = leer(K_VERIF, []);
        v.push({ num: r.num, n: item.n, op: item.op, id: item.id, nombre: item.d && item.d.nombre, licencia: item.d && item.d.licencia, t: Date.now() });
        guardar(K_VERIF, v);
        enviando = false; avisoRed = false;
        toast(item.op.indexOf('ck-') === 0 ? 'Enviando a GitHub…' : 'Enviando el cambio a todos los celulares…');
        estado();
        setTimeout(procesar, 0);
        setTimeout(verificar, 6000);
      })
      .catch(function(err){
        enviando = false;
        var tipo = (err && err.tipo) || 'datos';
        if (tipo === 'red') {
          bloqueoHasta = Date.now() + 60000;
          if (!avisoRed) { avisoRed = true; toast('Sin internet: el cambio quedó guardado y se publica solo cuando haya conexión.'); }
        } else if (tipo === 'auth' || tipo === 'repo') {
          bloqueoHasta = Date.now() + 5 * 60000;
          var vencida = !!(err && err.status === 401);
          var eraGuardada = !!claveGuardada();
          var dijo = (err && err.status) ? ' (GitHub dijo: ' + err.status + (err.msg ? ' ' + err.msg : '') + ')' : '';
          guardar(K_ERR, { s: (err && err.status) || 0, m: (err && err.msg) || '', t: Date.now() });
          if (vencida) claveRechazadaPorGitHub(401);   // vencida o revocada: se vuelve a pedir una nueva
          if (!avisoAuth) {
            avisoAuth = true;
            toast(vencida
              ? (eraGuardada
                  ? 'La clave de GitHub que cargaste en este celular ya no sirve' + dijo + '. Cargá una nueva en Modo instructor > Instructores > Publicación automática; los cambios quedan guardados y se publican apenas la cargues.'
                  : 'La clave de GitHub que trae esta app ya no sirve' + dijo + '. El administrador tiene que crear una clave nueva, cambiar el secreto FAVL_ISSUES_TOKEN en GitHub y volver a compilar el APK. Mientras tanto los cambios quedan guardados en este celular.')
              : (tipo === 'auth'
                ? 'GitHub no dejó publicar' + dijo + ': a la clave le falta el permiso «Issues: Read and write» sobre el repositorio (o hay demasiados pedidos juntos). Los cambios quedan guardados y se reintentan.'
                : 'GitHub no encontró el repositorio o tiene desactivados los pedidos (Issues)' + dijo + '. Los cambios quedan guardados.'), 'err', true);
          }
        } else {
          // el pedido es inválido: no tiene sentido reintentarlo
          guardar(K_COLA, leer(K_COLA, []).filter(function(x){ return x.n !== item.n; }));
          if (item.op === 'ck-new') marcarEmitida(item.id, -1, 'GitHub no aceptó el pedido');
          toast('No se pudo publicar el cambio' + (item.d && item.d.nombre ? ' de ' + item.d.nombre : '') + ' (datos o foto no aceptados). Quedó solo en este celular.', 'err', true);
        }
        estado();
      });
  }

  /* ---------- verificar el resultado (GitHub contesta en el mismo pedido) ---------- */
  var verificando = false;
  function consultar(it){
    return fetch(API + '/issues/' + it.num + '/comments?per_page=10&x=' + Date.now(), { headers: cab(false), cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function(arr){
        for (var i = 0; i < (arr || []).length; i++) {
          var c = arr[i];
          if (c && c.user && c.user.login === 'github-actions[bot]' && typeof c.body === 'string') {
            var m = /^FAVL-(OK|REPETIDO|RECHAZADO)\b/.exec(c.body);
            if (m) return { tipo: m[1], texto: c.body.split('\n').slice(1).join(' ').replace(/\s+/g, ' ').trim().slice(0, 220) };
          }
        }
        return null;
      });
  }
  function verificar(){
    if (verificando) return;
    var v = leer(K_VERIF, []);
    if (!v.length) return;
    verificando = true;
    var hechos = [];
    v.reduce(function(p, it){
      return p.then(function(){
        return consultar(it).then(function(res){ if (res) hechos.push({ it: it, res: res }); }, function(){});
      });
    }, Promise.resolve()).then(function(){
      verificando = false;
      var ahora = Date.now();
      var cerrados = {};
      hechos.forEach(function(h){ cerrados[h.it.n] = 1; });
      var resto = leer(K_VERIF, []).filter(function(x){
        if (cerrados[x.n]) return false;
        if (ahora - x.t > 40 * 60000) { if (x.op === 'ck-new') marcarEmitida(x.id, -1, 'GitHub no confirmó'); toast('GitHub no confirmó un cambio de instructores. Si no aparece en los otros celulares, repetilo.', 'err', true); return false; }
        return true;
      });
      guardar(K_VERIF, resto);
      hechos.forEach(function(h){ resultado(h.it, h.res); });
      estado();
    });
  }
  function resultado(it, res){
    if (it.op.indexOf('ck-') === 0) return resultadoClave(it, res);
    if (res.tipo === 'RECHAZADO') {
      toast('No se publicó: ' + (res.texto || 'GitHub rechazó el cambio.'), 'err', true);
      return;
    }
    if (it.op === 'set') {
      var pubs = leer(K_PUB, []).filter(function(p){ return p.id !== it.id; });
      pubs.push({ id: it.id, nombre: it.nombre || '', licencia: it.licencia || '', t: Date.now() });
      guardar(K_PUB, pubs);
    }

  function normalizarCk(s){ return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }

    function el(tag, css, txt){ var e = document.createElement(tag); if (css) e.style.cssText = css; if (txt) e.textContent = txt; return e; }
    caja.appendChild(el('h4', 'margin:6px 0 4px', 'Claves personales para rendir'));
    caja.appendChild(el('p', 'font-size:12px;opacity:.85;margin:0 0 8px;line-height:1.4',
      'Creá una clave para cada alumno que va a rendir y pasásela (por mensaje o en persona). Cada clave se usa una sola vez y vence a los ' + DIAS_CK +
      ' días. El alumno la escribe en «Acceso al examen» y la app la valida con GitHub (puede tardar hasta 2 minutos). Del alumno solo se publica un código secreto: su nombre queda únicamente en este celular.'));
    var inp = el('input', 'width:100%;box-sizing:border-box;padding:9px;font-size:15px;border:1px solid #888;border-radius:8px;margin-bottom:6px;background:#fff !important;color:#111 !important');
    inp.type = 'text'; inp.id = 'favlCkAlumno'; inp.placeholder = 'Nombre del alumno'; inp.maxLength = 60; inp.autocomplete = 'off';
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); crearClaveAlumno(); } });
    caja.appendChild(inp);
    var b = el('button'); b.type = 'button'; b.textContent = 'Crear clave'; b.className = 'ibtn'; b.id = 'favlCkCrear';
    b.onclick = crearClaveAlumno; caja.appendChild(b);
    var b2 = el('button'); b2.type = 'button'; b2.textContent = 'Actualizar estado'; b2.className = 'ibtn ibtn-sec';
    b2.onclick = function(){ refrescarRegistro(true); }; caja.appendChild(b2);
    var m = el('div', 'font-size:13px;min-height:1.3em;line-height:1.4;margin-top:4px'); m.id = 'favlCkMsg'; caja.appendChild(m);
    var lista = el('div', 'margin-top:6px'); lista.id = 'favlCkLista'; caja.appendChild(lista);
    var ex = el('div', 'margin-top:10px'); ex.id = 'favlCkExigir'; caja.appendChild(ex);
  }
  function pintarClaves(){
    var sec = document.getElementById('isec-claves'); if (!sec) return;
    var caja = document.getElementById('favlClavesAlumno');
    if (!caja) {
      caja = document.createElement('div'); caja.id = 'favlClavesAlumno';
      caja.style.cssText = 'padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #333';
      armarFormularioClaves(caja);
      sec.insertBefore(caja, sec.firstChild);
    }
    var reg = regGuardado(), lista = document.getElementById('favlCkLista'), ex = document.getElementById('favlCkExigir');
    if (lista) {
      lista.innerHTML = '';
      var em = emitidas();
      if (!em.length) {
        var v = document.createElement('div'); v.style.cssText = 'font-size:13px;opacity:.75'; v.textContent = 'Todavía no creaste claves en este celular.'; lista.appendChild(v);
      }
      em.forEach(function(x){
        var st = estadoClave(x, reg);
        var fila = document.createElement('div'); fila.className = 'irow';
        var info = document.createElement('div'); info.className = 'iinfo';
        var n = document.createElement('b'); n.textContent = x.alumno; info.appendChild(n);
        var c = document.createElement('span');
        c.style.cssText = 'display:block;font:700 18px/1.3 monospace;letter-spacing:1px;margin:2px 0;' + (st.cls === 'x' || st.cls === 'u' ? 'opacity:.5;text-decoration:line-through' : '');
        c.textContent = formatoCk(x.code); info.appendChild(c);
        var s = document.createElement('small'); s.style.cssText = 'display:block;opacity:1;color:' + (st.cls === 'ok' ? '#7ee787' : (st.cls === 'w' ? '#ffd479' : (st.cls === 'u' ? '#9ecbff' : '#ff9b9b')));
        s.textContent = st.txt; info.appendChild(s);
        fila.appendChild(info);
        var ac = document.createElement('div'); ac.className = 'iacciones';
        function bt(txt, fn, extra){ var b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.className = 'ibtn ' + (extra || 'ibtn-sec'); b.onclick = fn; ac.appendChild(b); }
        var vigente = st.cls === 'ok' || st.cls === 'w';
        if (vigente) {
          bt('Copiar', function(){
            copiarTexto(formatoCk(x.code),
              function(){ msgClaves('Clave de ' + x.alumno + ' copiada: pegásela al alumno.', false); },
              function(){ msgClaves('No se pudo copiar solo: anotá la clave que figura en la lista.', true); });
          });
          bt(anulando === x.h ? '¿Seguro? Tocá otra vez' : 'Anular', function(){ anularClave(x.h); }, 'ibtn-peligro');
        } else {
          bt('Quitar de la lista', function(){ quitarClave(x.h); });
        }
        fila.appendChild(ac); lista.appendChild(fila);
      });
    }
    if (ex) {
      ex.innerHTML = '';
      var on = exigirEfectivo(reg);
      var lab = document.createElement('label'); lab.style.cssText = 'display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'favlCkExigirCb'; cb.checked = on;
      cb.style.cssText = 'width:20px;height:20px;flex:none;margin:2px 0 0 0';
      cb.onchange = function(){ cambiarExigir(cb.checked); };
      var tx = document.createElement('span'); tx.textContent = 'Exigir la clave personal para rendir (el código del día deja de servir)';
      lab.appendChild(cb); lab.appendChild(tx); ex.appendChild(lab);
      var ay = document.createElement('div'); ay.style.cssText = 'font-size:12px;opacity:.8;margin:4px 0 0 28px;line-height:1.4';
      ay.textContent = on ? 'Ahora solo entran los alumnos con una clave personal. Antes de empezar, asegurate de haberle pasado una a cada uno.'
                          : 'Ahora los alumnos pueden entrar con el código del día o con una clave personal.';
      ex.appendChild(ay);
    }
  }
  function seccionClavesActiva(){
    var p = document.getElementById('panelInstructor'), s = document.getElementById('isec-claves');
    return !!(p && s && p.style.display === 'block' && s.classList.contains('activo'));
  }
  function refrescarRegistro(forzar){
    if (!forzar && Date.now() - (regGuardado().t || 0) < 60000) return;
    bajarRegistro(10000).then(function(r){
      if (forzar && !r) msgClaves('No se pudo consultar el estado (¿hay internet?).', true);
      pintarClaves();
    });
  }
  var oTab = window.mostrarTabInstructor;
  if (typeof oTab === 'function') window.mostrarTabInstructor = function(nombre){
    var r = oTab.apply(this, arguments);
    try { if (nombre === 'claves') { pintarClaves(); refrescarRegistro(false); } } catch (e) { console.error(e); }
    return r;
  };

  /* resultado de los pedidos de claves (los avisa el bot de GitHub en el mismo pedido) */
  function resultadoClave(it, res){
    if (it.op === 'ck-new') {
      if (res.tipo === 'RECHAZADO') { marcarEmitida(it.id, -1, res.texto); toast('No se creó la clave: ' + (res.texto || 'GitHub la rechazó.'), 'err', true); }
      else { marcarEmitida(it.id, 1, ''); toast('✔ Clave lista para usar.', 'ok'); }
    } else if (it.op === 'ck-del') {
      toast(res.tipo === 'RECHAZADO' ? 'No se pudo anular la clave: ' + (res.texto || '') : '✔ Clave anulada: ya no sirve.', res.tipo === 'RECHAZADO' ? 'err' : 'ok');
    } else {
      if (res.tipo === 'RECHAZADO') { borrar(K_EXIGIR); toast('No se pudo cambiar la opción: ' + (res.texto || ''), 'err', true); }
      else toast('✔ Listo: el cambio llega a todos los celulares en 1 o 2 minutos.', 'ok');
    }
    pintarClaves();
    refrescarRegistroTarde();
  }
  function refrescarRegistroTarde(){ setTimeout(function(){ if (seccionClavesActiva()) refrescarRegistro(true); }, 90000); }

  /* ---------- pantalla «Acceso al examen» (alumno) ---------- */
  var canjeando = false;
  function textoGate(txt){ var e = document.getElementById('errorCodigoAcceso'); if (e) e.textContent = txt || ''; }
  function gateOcupado(si){
    var i = document.getElementById('codigoAcceso'); if (i) i.disabled = !!si;
    var b = document.querySelector('#gateAcceso button'); if (b) b.disabled = !!si;
  }
  function abrirExamen(){
    var g = document.getElementById('gateAcceso'); if (g) g.style.display = 'none';
    var pb = document.getElementById('progressBarContainer'); if (pb) pb.style.display = 'block';
    var m = document.querySelector('main'); if (m) m.style.display = 'block';
    try { document.getElementById('codigoAcceso').removeEventListener('keydown', onEnterCodigoAcceso); } catch (e) {}
  }
  function claveRechazadaPorGitHub(status){
    if (status === 401) { if (claveGuardada()) borrar(K_TOK); else guardar(K_MALA, TOKEN_APK.slice(-10)); }
  }
  async function canjear(cod){
    if (canjeando) return;
    canjeando = true;
    var input = document.getElementById('codigoAcceso');
    try {
      var h = await hashCk(cod);
      var prev = leer(K_CANJE, null), num = null;
      if (prev && prev.h === h && typeof prev.num === 'number' && Date.now() - prev.t < 15 * 60000) {
        num = prev.num;                      // mismo celular y misma clave: se recupera el intento anterior (no se gasta otra vez)
      } else {
        var reg = regGuardado(), k = null, i;
        for (i = 0; i < reg.claves.length; i++) if (reg.claves[i].h === h) k = reg.claves[i];
        if (k && k.u > 0) { textoGate('Esta clave ya fue usada. Pedile una nueva a tu instructor.'); return; }
        if (k && k.e <= Date.now()) { textoGate('Esta clave venció. Pedile una nueva a tu instructor.'); return; }
        if (!clave()) { textoGate('Esta versión de la app no puede validar claves personales. Actualizá la app o pedile a tu instructor otra forma de ingresar.'); return; }
      }
      gateOcupado(true);
      textoGate('Validando tu clave… puede tardar hasta 2 minutos. No cierres la app.');
      if (num == null) {
        var r = await crearPedido(JSON.stringify({ v: 1, n: nonce(), t: Date.now(), op: 'ck-use', id: h }), 'FAVL-INSTR ck-use ' + nonce().slice(0, 8));
        num = r.num;
        guardar(K_CANJE, { h: h, num: num, t: Date.now() });
      }
      var inicio = Date.now(), res = null;
      var tope = window.__favlCkTope || 240000, cada = window.__favlCkCada || 5000;
      var primera = window.__favlCkPrimera != null ? window.__favlCkPrimera : 10000;
      await esperar(primera);
      while (true) {
        try { res = await consultar({ num: num }); } catch (e) { res = null; }
        if (res || Date.now() - inicio >= tope) break;
        textoGate('Validando tu clave… (' + Math.round((Date.now() - inicio) / 1000) + ' s). Puede tardar hasta 2 minutos; no cierres la app.');
        await esperar(cada);
      }
      if (!res) { textoGate('GitHub está tardando más de lo normal. Esperá un momento y tocá «Ingresar» otra vez con la misma clave: no se pierde.'); return; }
      if (res.tipo === 'RECHAZADO') {
        borrar(K_CANJE);
        textoGate(res.texto || 'La clave no es válida. Pedile una nueva a tu instructor.');
        if (input) { input.value = ''; }
        return;
      }
      textoGate('');
      abrirExamen();
    } catch (e) {
      var st = (e && e.status) || 0;
      if (e && (e.tipo === 'auth' || e.tipo === 'repo')) {
        claveRechazadaPorGitHub(st);
        textoGate('La app no pudo validar tu clave por un problema de la propia app (no tuyo). Pedile a tu instructor el código del día e ingresalo acá.' +
          ((window.__favlVersion && window.__favlVersion.hayNueva()) ? ' Además hay una versión nueva de la app: actualizala.' : ''));
      } else if (e && e.tipo === 'red') {
        textoGate('Sin conexión con el servidor. Revisá tu internet y probá de nuevo: tu clave no se gastó.');
      } else {
        textoGate('No se pudo validar la clave. Probá de nuevo; si sigue igual, avisale a tu instructor.');
      }
    } finally {
      canjeando = false; gateOcupado(false);
      try { if (input && document.getElementById('gateAcceso').style.display !== 'none') input.focus(); } catch (e) {}
    }
  }
  var validarOriginal = window.validarCodigoAcceso;
  if (typeof validarOriginal === 'function') window.validarCodigoAcceso = async function(){
    var input = document.getElementById('codigoAcceso');
    var texto = String((input && input.value) || '');
    if (canjeando) return;
    if (!texto.trim()) return validarOriginal.apply(this, arguments);
    var cod = normalizarCk(texto);
    if (RE_CK.test(cod)) return canjear(cod);
    // otro código (el del día o uno fijo): sirve salvo que el instructor haya pedido exigir la clave personal.
    // Si esta app no puede validar claves (no trae la clave de GitHub o GitHub la rechazó), no se exige: nadie queda afuera por un problema de la app.
    var reg = regGuardado();
    if (clave() && Date.now() - (reg.t || 0) > 2 * 60000) { var nueva = await bajarRegistro(2500); if (nueva) reg = nueva; }
    if (clave() && exigirEfectivo(reg)) {
      textoGate('Para rendir necesitás tu clave personal (formato XXXX-XXXX-XXXX), que te da tu instructor.');
      if (input) { input.value = ''; input.focus(); }
      return;
    }
    return validarOriginal.apply(this, arguments);
  };

  /* ---------- arranque y reintentos ---------- */
  function tic(){
    if (document.hidden) return;
    procesar(); if (leer(K_VERIF, []).length) verificar();
    try { if (seccionClavesActiva()) refrescarRegistro(false); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { bloqueoHasta = Math.min(bloqueoHasta, Date.now() + 2000); tic(); } });
  window.addEventListener('online', function(){ bloqueoHasta = 0; tic(); });
  setInterval(tic, 10000);
  setTimeout(tic, 3000);
  // si ya había una lista bajada antes de que este bloque existiera, también se limpia lo ya publicado
  setTimeout(function(){
    try {
      var c = leer('favlInstrRemotoV1', null);
      if (c && typeof c.version === 'number' && Array.isArray(c.instructores) && window.__favlAbsorber(c.instructores, c.version)) aplicarCambioInstructores(null);
    } catch (e) {}
  }, 1500);
})();
</script>
