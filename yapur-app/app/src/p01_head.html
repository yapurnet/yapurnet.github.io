<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C77">
<meta name="mobile-web-app-capable" content="yes">
<title>Gestión YAPUR.NET</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: encabezado fijo con marca y rol, pestañas con scroll propio, contenido en una columna de 980px; las fichas se abren como hoja inferior en el celular. */
:root{
  /* zonas seguras (muesca, barras del sistema): sirve tanto en el navegador como dentro de la app de Android */
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)); --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)); --sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  --bg:#EDF2F4; --surface:#FFFFFF; --surface-2:#F4F8F9; --ink:#0E2230; --muted:#587080; --line:#D3DDE3;
  --accent:#0A7C77; --accent-ink:#FFFFFF; --accent-soft:#D6EFEC; --accent-line:#9CD4CF;
  --ok:#1E8449; --ok-soft:#DDF3E4; --warn:#8F5F00; --warn-soft:#FBEFCF; --bad:#B83227; --bad-soft:#FADDD9; --info:#245FA8; --info-soft:#DCE8F7;
  --shadow:0 1px 2px rgba(14,34,48,.06),0 10px 28px rgba(14,34,48,.10); --scrim:rgba(8,20,28,.5);
  --f-display:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B171F; --surface:#12222C; --surface-2:#182E3A; --ink:#E5EEF2; --muted:#8CA3B1; --line:#25404F;
  --accent:#3CC4BB; --accent-ink:#05211F; --accent-soft:#123B3C; --accent-line:#1F6663;
  --ok:#4CC17F; --ok-soft:#143A27; --warn:#E0B04B; --warn-soft:#3D3112; --bad:#F0786C; --bad-soft:#411C18; --info:#7FB0EA; --info-soft:#172E4A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B171F; --surface:#12222C; --surface-2:#182E3A; --ink:#E5EEF2; --muted:#8CA3B1; --line:#25404F;
  --accent:#3CC4BB; --accent-ink:#05211F; --accent-soft:#123B3C; --accent-line:#1F6663;
  --ok:#4CC17F; --ok-soft:#143A27; --warn:#E0B04B; --warn-soft:#3D3112; --bad:#F0786C; --bad-soft:#411C18; --info:#7FB0EA; --info-soft:#172E4A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px;line-height:1.2} h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.right{text-align:right} .nowrap{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
