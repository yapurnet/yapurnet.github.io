/* ----- horas trabajadas: resumen por día y por semana (la oficina) y «mis horas» (cada técnico) ----- */
const HR={desde:'',data:null,err:'',busy:false};
/* la hora de Argentina (UTC−3), sin importar en qué zona esté el celular: así lo que se ve coincide con lo que el servidor cuenta */
const hhmmAR=ts=>new Date(ts-3*36e5).toISOString().slice(11,16);
const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');   /* 5:10 */
const horasTxt=m=>m>0?durTxt(m):'0 h';                              /* 5 h 10 min */
const horasDec=m=>(m/60).toFixed(2).replace('.',',');               /* 5,17 */
const fechaCorta=f=>f.slice(8)+'/'+f.slice(5,7);
const diaLetra=f=>['D','L','M','M','J','V','S'][new Date(f+'T12:00:00Z').getUTCDay()];
const diaNombre=f=>['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][new Date(f+'T12:00:00Z').getUTCDay()];
const sumaDias=(f,n)=>new Date(Date.parse(f+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
const mapHoras=x=>x.estado==='sin_registro'?'–':hm(x.min);
/* qué quiere decir cada estado del día, en una frase */
function horasEstadoTxt(x){
  if(x.estado==='corregido')return 'Cargado a mano por '+(x.ajuste&&x.ajuste.por||'la oficina')+(x.ajuste&&x.ajuste.nota?': '+x.ajuste.nota:'')+'.';
  if(x.estado==='incompleto')return 'Falta el regreso a la base: se cuenta hasta la última posición recibida. Revisalo y corregilo si hace falta.';
  if(x.estado==='en_curso')return 'En curso: se cuenta hasta ahora.';
  if(x.estado==='sin_registro')return 'Sin registro ese día.';
  return 'Completo.'+(x.estimado?' La tarde se cuenta desde que empezó, porque no se vio al técnico en la base al retomar.':'');
}
const horasSegsTxt=x=>(x.segs||[]).map(g=>hhmmAR(g[0])+'-'+hhmmAR(g[1])).join(' | ');
async function horasCargar(){
  if(HR.busy)return;HR.busy=true;
  try{HR.data=await NET.api('GET','/api/jornada/horas'+(HR.desde?'?desde='+encodeURIComponent(HR.desde)+'&dias=7':''),undefined,{noKick:true,timeout:20000});HR.err='';if(!HR.desde)HR.desde=HR.data.desde;}
  catch(e){HR.err=e&&e.message||'No se pudieron cargar las horas.';}
  HR.busy=false;horasRender();
}
function horasRender(){
  const out=$('#hr-out');if(!out)return;
  const d=HR.data;
  if(!d){out.innerHTML=HR.err?`<div class="notice bad">${esc(HR.err)}</div>`:'<div class="hint">Cargando…</div>';return;}
  const esAct=d.desde<=d.hoy&&d.hoy<=d.hasta;
  const nav=`<div class="line hr-nav"><button class="btn small ghost" type="button" data-hr-nav="-7" aria-label="Semana anterior">‹</button><b>Semana del ${esc(fechaCorta(d.desde))} al ${esc(fechaCorta(d.hasta))}</b><button class="btn small ghost" type="button" data-hr-nav="7" aria-label="Semana siguiente"${d.hasta>=d.hoy?' disabled':''}>›</button>${esAct?'':'<button class="btn small ghost" type="button" data-hr-nav="0">Esta semana</button>'}</div>`;
  const tot=d.tecnicos.reduce((a,t)=>a+t.total,0),inc=d.tecnicos.reduce((a,t)=>a+t.incompletos,0);
  const alerta=inc?`<div class="notice" role="status" id="hr-alerta">Hay <b>${inc} ${inc===1?'día':'días'} sin cerrar</b> (no se vio volver a la base). Tocalos para revisarlos.</div>`:'';
  const tarjetas=d.tecnicos.length?d.tecnicos.map(t=>`<article class="card tcard"><div class="head-row"><h3 style="overflow-wrap:anywhere">${esc(t.nombre)}</h3><div class="hr-tot" title="${esc(horasDec(t.total))} h">${esc(horasTxt(t.total))}</div></div>
    <div class="hrgrid">${t.dias.map(x=>`<button type="button" class="hrc ${x.estado}${x.dia===d.hoy?' hoy':''}" data-hr="${esc(t.id)}|${esc(x.dia)}" aria-label="${esc(t.nombre+', '+diaNombre(x.dia)+' '+fechaCorta(x.dia)+': '+(x.estado==='sin_registro'?'sin registro':horasTxt(x.min)))}"><span class="hrl">${diaLetra(x.dia)} ${esc(x.dia.slice(8))}</span><b>${esc(mapHoras(x))}${x.estado==='corregido'?'*':''}</b></button>`).join('')}</div>
    <div class="small muted">Promedio por día trabajado: ${esc(promDia(t))}${t.corregidos?' · * cargado a mano':''}</div></article>`).join(''):'<div class="empty"><b>No hay técnicos cargados</b></div>';
  out.innerHTML=`${nav}${alerta}<div class="small muted">Horas de todos los técnicos en la semana: <b>${esc(horasTxt(tot))}</b>. Cada casilla es un día (horas:minutos). Tocá una para ver el detalle${isAdmin()?' y corregirla':''}.</div>${tarjetas}
    <div class="actions start"><button class="btn small" type="button" id="hr-copy">Copiar el resumen</button><button class="btn small" type="button" id="hr-csv">Descargar CSV</button></div>`;
}
function promDia(t){const dd=t.dias.filter(x=>x.min>0);return dd.length?horasTxt(Math.round(t.total/dd.length)):'–';}
function horasTexto(d){
  const L=['Horas trabajadas · semana del '+fechaCorta(d.desde)+' al '+fechaCorta(d.hasta)];
  for(const t of d.tecnicos){
    L.push('',t.nombre+': '+horasTxt(t.total)+' ('+horasDec(t.total)+' h)');
    for(const x of t.dias)if(x.estado!=='sin_registro')L.push('  '+diaNombre(x.dia).slice(0,3)+' '+fechaCorta(x.dia)+': '+horasTxt(x.min)+(x.estado==='incompleto'?' (sin cerrar)':x.estado==='corregido'?' (corregido)':x.estado==='en_curso'?' (en curso)':''));
  }
  return L.join('\n');
}
function horasCsv(d){
  const rows=[['Técnico','Fecha','Día','Horas (h:mm)','Horas (decimal)','Estado','Tramos','Nota']];
  for(const t of d.tecnicos){
    for(const x of t.dias)if(x.estado!=='sin_registro')rows.push([t.nombre,x.dia,diaNombre(x.dia),hm(x.min),horasDec(x.min),x.estado,horasSegsTxt(x),x.ajuste&&x.ajuste.nota||'']);
    rows.push([t.nombre,'TOTAL','',hm(t.total),horasDec(t.total),'','','']);
  }
  return toCsv(rows);
}
/* detalle de un día de un técnico (con «Corregir» para el administrador) */
function horaDetalle(tid,dia){
  const d=HR.data;if(!d)return;
  const t=d.tecnicos.find(x=>x.id===tid),x=t&&t.dias.find(y=>y.dia===dia);if(!x)return;
  const origen=x.origen==='base'?'Ingresó en la base':x.origen==='manual'?'Inició a mano':x.origen==='oficina'?'Cargado por la oficina':'';
  openModal({title:`${t.nombre} · ${diaNombre(dia)} ${fechaCorta(dia)}`,html:`<div class="hr-big">${esc(x.estado==='sin_registro'?'Sin registro':horasTxt(x.min))}</div>
    ${x.estado==='sin_registro'?'':`<div class="small muted">${esc(horasDec(x.min))} horas</div>`}
    <p class="${x.estado==='incompleto'?'notice':'small'}">${esc(horasEstadoTxt(x))}</p>
    ${x.segs&&x.segs.length?`<ul class="plain">${x.segs.map(g=>`<li>${esc(hhmmAR(g[0]))} a ${esc(hhmmAR(g[1]))} · ${esc(horasTxt(Math.round((g[1]-g[0])/60000)))}</li>`).join('')}</ul>`:''}
    ${origen&&x.estado!=='corregido'?`<div class="small muted">${esc(origen)}${x.regreso?' · último regreso a la base '+esc(hhmmAR(x.regreso)):''}</div>`:''}
    <div class="actions">${d.puedeAjustar?'<button class="btn primary" type="button" id="hd-corr">Corregir las horas</button>':''}<button class="btn ghost" type="button" data-close>Cerrar</button></div>`,
    onMount(el){const b=$('#hd-corr',el);if(b)b.addEventListener('click',()=>{closeModal();horaCorregir(t,x);});}});
}
function horaCorregir(t,x){
  const dia=x.dia,tr=(x.tramos&&x.tramos.length?x.tramos:[[8,20]]),dos=tr.length>1||(x.segs&&x.segs.length>1);
  const segs=(x.segs&&x.segs.length?x.segs:[]).map(g=>[hhmmAR(g[0]),hhmmAR(g[1])]);
  while(segs.length<(dos?2:1))segs.push(['','']);
  const campo=(i,k,v)=>`<input id="hc-${k}${i}" type="time" step="60" value="${esc(v)}" aria-label="${k==='a'?'Desde':'Hasta'} (tramo ${i+1})">`;
  openModal({title:`Corregir · ${t.nombre} · ${fechaCorta(dia)}`,html:`<form class="form" id="hc-form" novalidate><div class="hint">Cargá a qué hora empezó y a qué hora terminó de trabajar${dos?' en cada tramo (mañana y tarde)':''}. Lo que cargues reemplaza el cálculo automático de ese día y queda marcado como corregido.</div>
    ${segs.map((g,i)=>`<div class="grid2">${F((dos?(i?'Tarde':'Mañana')+' · ':'')+'Desde','hc-a'+i,campo(i,'a',g[0]))}${F((dos?(i?'Tarde':'Mañana')+' · ':'')+'Hasta','hc-b'+i,campo(i,'b',g[1]))}</div>`).join('')}
    ${F('Motivo (queda anotado)','hc-n',`<input id="hc-n" maxlength="200" autocomplete="off" placeholder="Ej.: se le apagó el celular" value="${esc(x.ajuste&&x.ajuste.nota||'')}">`)}
    <div class="actions"><button class="btn ghost" type="button" data-close>Cancelar</button>${x.estado==='corregido'?'<button class="btn ghost" type="button" id="hc-auto">Volver al cálculo automático</button>':''}<button class="btn primary" type="submit">Guardar</button></div></form>`,
    onMount(el){
      const enviar=async body=>{try{await NET.api('POST','/api/jornada/ajuste',Object.assign({uid:t.id,dia},body));toast('Horas guardadas');closeModal();HR.data=null;horasRender();horasCargar();}catch(err){toast(err&&err.message||'No se pudo guardar','bad');}};
      $('#hc-form',el).addEventListener('submit',e=>{
        e.preventDefault();const out=[];
        for(let i=0;i<segs.length;i++){
          const a=$('#hc-a'+i,el).value,b=$('#hc-b'+i,el).value;
          if(!a&&!b)continue;
          if(!a||!b)return toast('Completá «desde» y «hasta» del tramo','bad');
          const ta=Date.parse(dia+'T'+a+':00-03:00');let tb=Date.parse(dia+'T'+b+':00-03:00');if(b==='00:00'&&tb<=ta)tb+=864e5;   /* 00:00 de «hasta» = fin del día */
          if(!(tb>ta))return toast('«Hasta» tiene que ser después de «desde»','bad');
          out.push([ta,tb]);
        }
        if(!out.length)return toast('Cargá al menos un tramo (o tocá «Volver al cálculo automático»)','bad');
        enviar({segs:out,nota:$('#hc-n',el).value});
      });
      const au=$('#hc-auto',el);if(au)au.addEventListener('click',()=>enviar({quitar:true}));

function receiptData(recibo){

  }

    nro:recibo,anulado:!!p0.anulado,fecha:p0.fecha,hora:p0.hora||'',total,cond:cond(p0),periodo,
    emisor:{leyenda:String(R.leyenda||'').trim(),razon:String(R.razon||'').trim()||S.ajustes.empresa||'',cuit:String(R.cuit||'').trim(),iibb:String(R.iibb||'').trim(),dom:String(R.dom||'').trim(),
      tel:String(R.tel||'').trim(),web:String(R.web||'').trim(),pv:String(R.pv||'').trim(),alias:Array.isArray(R.alias)?R.alias.map(x=>String(x).trim()).filter(Boolean):[]},
    cliente:{nombre:c?c.nombre:'—',codigo:c&&c.codigo||'',dni:c&&c.dni||'',dir:c?[c.dir,c.loc].filter(Boolean).join(', '):'',iva:'Consumidor Final',servicio:c&&mens.length&&servicioTxt(c)!=='Sin plan'?servicioTxt(c):''},
    lineas:ps.map(p=>({
      desc:p.concepto==='mensualidad'?'Abono Mensual Servicio de Internet'+(p.per?' ('+monthLabel(p.per).toLowerCase()+')':''):(CONCEPTOS[p.concepto]||'Otro')+(p.nota?': '+p.nota:''),

function receiptText(recibo){

/* ===== foto del comprobante de una transferencia =====
   Quien cobra en la calle y recibe una transferencia tiene que adjuntar la foto del comprobante: el servidor no registra el cobro sin ella.
   La foto se reduce en el celular (lado mayor 1400 px, JPEG de menos de 400 KB) y se sube apenas se elige; el cobro lleva solo su número. */
const COMP_METODOS=['transferencia'];
const pideComp=metodo=>soloCampo()&&COMP_METODOS.includes(metodo);
function fotoJpeg(file){
  return new Promise((ok,mal)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
        let q=0.8,d=cv.toDataURL('image/jpeg',q);
        while(d.length*0.75>400e3&&q>0.35){q-=0.1;d=cv.toDataURL('image/jpeg',q);}
        URL.revokeObjectURL(url);
        if(d.length*0.75>440e3)mal(new Error('La foto es demasiado grande. Sacala de nuevo más cerca del comprobante.'));else ok(d);
      }catch(e){URL.revokeObjectURL(url);mal(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);mal(new Error('No se pudo leer la foto. Elegí una imagen (JPG o PNG).'));};
    img.src=url;
  });
}
function compHTML(px){
  return `<div class="fgroup" id="${px}-comp" hidden><div class="legend">Comprobante de la transferencia *</div>
    <div class="hint">Sacale una foto al comprobante con la cámara del celular (o usá la captura que te mandó el cliente) y elegila acá. Sin la foto no se registra el cobro.</div>
    <div class="actions start"><button class="btn small" type="button" id="${px}-comp-b">Elegir la foto</button><input id="${px}-comp-f" type="file" hidden></div>
    <img id="${px}-comp-img" class="comp-thumb" alt="Foto del comprobante" hidden><div class="hint" id="${px}-comp-st"></div></div>`;
}
function mountComp(el,px,getMetodo){
  const box=$('#'+px+'-comp',el),f=$('#'+px+'-comp-f',el),img=$('#'+px+'-comp-img',el),st=$('#'+px+'-comp-st',el);
  let id=null,busy=false;
  $('#'+px+'-comp-b',el).addEventListener('click',()=>f.click());
  f.addEventListener('change',async()=>{
    const file=f.files&&f.files[0];f.value='';if(!file)return;
    busy=true;id=null;img.hidden=true;st.className='hint';st.textContent='Subiendo la foto…';
    try{
      const d=await fotoJpeg(file),r=await NET.api('POST','/api/comprobante',{img:d},{timeout:60000});
      id=r.id;img.src=d;img.hidden=false;st.className='hint ok';st.textContent='Foto lista. Si te equivocaste, elegí otra.';
    }catch(e){st.className='hint bad';st.textContent=e.network?'No hay conexión: no se pudo subir la foto. Probá de nuevo.':(e.message||'No se pudo subir la foto.');}
    finally{busy=false;}
  });
  /* antes de registrar el cobro: devuelve el texto del problema, o '' si está todo bien */
  const falta=()=>!pideComp(getMetodo())?'':busy?'Esperá: se está subiendo la foto del comprobante':id?'':'Adjuntá la foto del comprobante de la transferencia';
  return {sync:()=>{box.hidden=!pideComp(getMetodo());},id:()=>pideComp(getMetodo())?id:null,falta};
}

  try{await saveClient(c,{promesas:c.promesas.map(x=>x===pr?Object.assign({},x,{x:1,xf:todayStr()}):x)});toast('Promesa anulada');closeModal();}catch(err){dbError(err);}

/* ===== cortes y reconexiones ===== */
function cortesData(){
  const cortar=[],reconectar=[],promesas=[];
  const vis=can('clientesTodos')?null:visibleSet();
  for(const c of S.clientes.values()){
    if(c.estado!=='activo'&&c.estado!=='suspendido')continue;
    if(vis&&!vis.has(c.id))continue;
    const s=cutState(c);
    if(c.estado==='activo'&&s.k==='cortar')cortar.push({c,s});
    else if(aReconectar(c))reconectar.push({c,s});
    if(s.k==='promesa')promesas.push({c,s});
  }
  const byName=(a,b)=>norm(a.c.nombre).localeCompare(norm(b.c.nombre));
  cortar.sort((a,b)=>a.s.desde.localeCompare(b.s.desde)||byName(a,b));
  reconectar.sort(byName);
  promesas.sort((a,b)=>a.s.hasta.localeCompare(b.s.hasta)||byName(a,b));
  return {cortar,reconectar,promesas};
}
async function setSuspension(clients,on){
  if(!can('editarClientes'))return toast('Tu perfil no puede cambiar el estado de los clientes','bad');
  const by={},now=Date.now(),today=todayStr();
  clients.forEach(c=>{
    const o=Object.assign(stripInternal(c),on?{estado:'suspendido',corteMora:today}:{estado:'activo',corteMora:null,reconectado:today},{mod:now});
    (by[clientShard(c.id)]=by[clientShard(c.id)]||{})[c.id]=o;
  });
  try{for(const sh of Object.keys(by))await putMany('clientes',sh,by[sh]);toast(on?`${clients.length} marcados como suspendidos`:`${clients.length} reconectados`);}
  catch(err){dbError(err);}
}
/* script de MikroTik para clientes con usuario PPPoE cargado */
function mikrotikScript(list,enable){
  const withU=list.filter(c=>c.usuario&&String(c.usuario).trim());
  const q=u=>String(u).trim().replace(/["\\$\r\n]/g,'');
  const lines=[`# ${enable?'Reconexiones':'Cortes'} ${S.ajustes.empresa} - ${dmy(todayStr())} - revisalo antes de pegarlo`];
  withU.forEach(c=>lines.push(`/ppp secret ${enable?'enable':'disable'} [find name="${q(c.usuario)}"]`));
  if(!enable)withU.forEach(c=>lines.push(`/ppp active remove [find name="${q(c.usuario)}"]`));
  return {text:lines.join('\n'),n:withU.length,sin:list.length-withU.length};
}
function copyScript(list,enable){
  const r=mikrotikScript(list,enable);
  if(!r.n)return toast('Ninguno tiene usuario cargado','bad');
  copyText(r.text,'Script');
  if(r.sin)setTimeout(()=>toast(`${r.sin} sin usuario quedaron afuera`,'bad'),900);
}
function copyUsers(list){
  const u=list.map(c=>String(c.usuario||'').trim()).filter(Boolean);
  if(!u.length)return toast('Ninguno tiene usuario cargado','bad');
  copyText(u.join('\n'),'Usuarios');
}
async function bulkCortes(kind){
  const cd=cortesData();
  const cs=(kind==='susp'||kind==='script-off'||kind==='users-off')?cd.cortar.map(x=>x.c):cd.reconectar.map(x=>x.c);
  if(!cs.length)return;
  if(kind==='script-off')return copyScript(cs,false);
  if(kind==='script-on')return copyScript(cs,true);
  if(kind==='users-off'||kind==='users-on')return copyUsers(cs);
  const on=kind==='susp';
  if(!await askConfirm(on?`¿Marcar ${cs.length} clientes como suspendidos? Solo cambia el estado en la app: el corte en el router lo hacés vos.`:`¿Marcar ${cs.length} clientes como reconectados? Solo cambia el estado en la app.`,on?'Marcar suspendidos':'Marcar reconectados',on))return;
  await setSuspension(cs,on);
}

/* cierre de caja: lo que cobró cada persona (para contar el efectivo que tiene que entregar cada una) */
function cajaPorCobrador(ok){
  const by={};
  ok.forEach(p=>{const k=p.por||'';const o=by[k]||(by[k]={nom:'',rec:new Set(),efectivo:0,otros:0,total:0});if(!o.nom)o.nom=cobradorName(p);const m=Number(p.monto)||0;o.rec.add(p.recibo);o.total+=m;if(p.metodo==='efectivo')o.efectivo+=m;else o.otros+=m;});
  const rows=Object.entries(by).sort((a,b)=>b[1].total-a[1].total);
  if(!rows.length)return '';
  return `<div class="card" style="margin-top:12px"><h3>Por cobrador</h3><div class="tbl-wrap"><table><thead><tr><th>Cobró</th><th class="right">Recibos</th><th class="right">Efectivo</th><th class="right">Otros medios</th><th class="right">Total</th></tr></thead><tbody>${rows.map(([k,o])=>`<tr><td>${esc(o.nom||'Sin dato')}</td><td class="right tnum">${o.rec.size}</td><td class="right tnum">${fmtMoney(o.efectivo)}</td><td class="right tnum">${fmtMoney(o.otros)}</td><td class="right tnum"><b>${fmtMoney(o.total)}</b></td></tr>`).join('')}</tbody></table></div><div class="hint">El efectivo de cada persona es lo que tiene que entregar en el día.</div></div>`;
}

/* ===== Mis cobros (quien cobra en la calle) ===== */
const MC={err:''};
async function loadMisCobros(){
  try{
    const j=await NET.api('GET','/api/mis-cobros?dias=7');
    (j.docs||[]).forEach(d=>{const it=(d.data||{}).items||{};for(const k in it)S.pagos.set(k,Object.assign({},it[k],{id:k,_doc:d.id}));});
    MC.err='';rebuildDerived();dataChanged('pagos');
    /* el recibo por WhatsApp sale a los pocos segundos: se vuelve a mirar para mostrar si salió */
    if([...S.pagos.values()].some(p=>p.wa&&p.wa.e==='pendiente'&&Date.now()-(p.wa.ts||0)<120e3)&&(MC.tries=(MC.tries||0)+1)<=8)setTimeout(loadMisCobros,4000);else MC.tries=0;
  }catch(e){MC.err=e&&e.network?'Sin conexión: se muestran los cobros que ya se cargaron.':'No se pudieron actualizar tus cobros.';dataChanged('pagos');}
}

/* ===== avisos de actualización =====
   1) App nueva en el servidor: /version.json trae el código de la versión publicada. Si no es la que está corriendo,
      aparece «Hay una versión nueva» con el botón Actualizar (recarga y listo; en el APK no hace falta reinstalar nada).
   2) APK nuevo (solo dentro del APK): el flujo que compila el APK publica yapur-version.json en el sitio de GitHub.
      Si el APK instalado es anterior, aparece «Hay un APK nuevo» con el botón Descargar. */
const BUILD='fa306b86c3';
const APK_INFO_URL='https://yapurnet.github.io/yapur-version.json';
const UPD={web:'',apk:null,hide:{}};
const verNum=s=>{const m=/^(\d+)\.(\d+)/.exec(String(s||'').trim());return m?Number(m[1])*100000+Number(m[2]):0;};
function drawUpdateBar(){
  const web=UPD.web&&UPD.hide.web!==UPD.web,apk=UPD.apk&&UPD.hide.apk!==UPD.apk.nombre;
  let el=document.getElementById('updBar');
  if(!web&&!apk){if(el)el.remove();return;}
  if(!el){
    el=document.createElement('div');el.id='updBar';el.className='upd';el.setAttribute('role','status');
    document.body.appendChild(el);
    el.addEventListener('click',e=>{
      const b=e.target.closest('[data-upd]');if(!b)return;
      const k=b.dataset.upd;
      if(k==='web-go')reloadForUpdate();
      else if(k==='apk-go'&&UPD.apk)NET.openExternal(UPD.apk.url);
      else if(k==='web-no'){UPD.hide.web=UPD.web;drawUpdateBar();}
      else if(k==='apk-no'&&UPD.apk){UPD.hide.apk=UPD.apk.nombre;drawUpdateBar();}
    });
  }
  el.innerHTML=(web?`<div class="upd-row"><span>Hay una versión nueva de la app.</span><span class="upd-act"><button class="btn small primary" type="button" data-upd="web-go">Actualizar</button><button class="btn small ghost" type="button" data-upd="web-no" aria-label="Avisar más tarde">Después</button></span></div>`:'')
    +(apk?`<div class="upd-row"><span>Hay un APK nuevo (${esc(UPD.apk.nombre)}) con mejoras. Se baja y se instala encima, sin perder nada.</span><span class="upd-act"><button class="btn small primary" type="button" data-upd="apk-go">Descargar</button><button class="btn small ghost" type="button" data-upd="apk-no" aria-label="Avisar más tarde">Después</button></span></div>`:'');
}
async function reloadForUpdate(){
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}catch(e){}
  location.reload();
}
let _updLast=0;
async function checkUpdates(force){
  const now=Date.now();if(!force&&now-_updLast<60000)return;_updLast=now;
  try{
    const r=await fetch('/version.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();UPD.web=(j&&typeof j.v==='string'&&/^[0-9a-f]{6,64}$/.test(j.v)&&j.v!==BUILD)?j.v:'';}
  }catch(e){}
  if(NET.native){
    try{
      const r=await fetch(APK_INFO_URL,{cache:'no-store'});
      if(r.ok){
        const j=await r.json(),have=verNum(NET.appVersion),want=verNum(j&&j.nombre);
        UPD.apk=(have>0&&want>have&&/^https:\/\/[^\s'"<>]+\.apk$/.test(String(j.apk||'')))?{nombre:String(j.nombre),url:String(j.apk)}:null;
      }
    }catch(e){}
  }
  drawUpdateBar();
}
function startUpdateWatch(){
  setTimeout(()=>checkUpdates(true),4000);
  setInterval(()=>checkUpdates(false),10*60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdates(false);});
  window.addEventListener('online',()=>checkUpdates(false));
}

/* ===== sesión y permisos ===== */
const allPerms=()=>{const o={};PERMS.forEach(([k])=>{o[k]=true;});return o;};
function deriveTecnicos(){
  S.ajustes.tecnicos=S.ajustes.perfiles.filter(p=>p.base==='tecnico'&&p.activo!==false).map(p=>({id:p.id,nombre:p.nombre,tel:p.tel||''}));
}
function permsOfPerfil(p){
  const perms=Object.assign({},PERM_DEF[p.base],p.permisos||{});
  if(p.base==='tecnico')MONEY_PERMS.forEach(k=>{perms[k]=false;});
  return perms;
}
/* los permisos reales los decide el servidor; el administrador además puede ver la app como la ve cada usuario */
function computePerms(){
  S.perfil=null;S.preview=false;S.gate=false;
  const me=S.me;
  if(S.realRole==='admin'){
    const prev=lsGet('viewAsP'),pp=prev&&S.ajustes.perfiles.find(p=>p.id===prev&&p.activo!==false);
    if(pp){S.perfil=pp;S.preview=true;S.perms=permsOfPerfil(pp);S.role=pp.base;}
    else{S.perms=allPerms();S.role='admin';}
  }else{
    S.perms=Object.assign({},me.perms);S.role=me.role;
    S.perfil=S.ajustes.perfiles.find(p=>p.id===me.id)||{id:me.id,nombre:me.nombre,base:me.role,tel:me.tel||''};
  }
  S.tecId=S.perfil&&S.perfil.base==='tecnico'?S.perfil.id:'';
  S.pv++;
}

let tabsHtml='',renderTimer=null;
function allowedTabs(){
  const t=[];if(S.gate)return t;

  if(can('red'))t.push(['red','Red']);
  if(soloCampo())t.push(['miscobros','Mis cobros']);

  if(can('verTecnicos'))t.push(['tecnicos','Técnicos']);
  if(isAdmin())t.push(['ajustes','Ajustes']);
  return t;

function renderTabs(){
  const open=[...S.ordenes.values()].filter(ORD_OPEN).length;

function showTab(t){
  const tabs=allowedTabs();if(!tabs.length)return;
  if(!tabs.some(x=>x[0]===t))t=tabs[0][0];

function updateHeader(){

function dataChanged(key){

  if(renderTimer)return;

$('#view').addEventListener('click',e=>{

/* ===== datos ===== */
const started={};
function startData(){
  if(!S.db)return;
  if(!started.planes){started.planes=1;
    S.db.collection('planes').onSnapshot(snap=>{
      S.planes.clear();snap.docs.forEach(d=>S.planes.set(d.id,Object.assign({},d.data(),{id:d.id})));
      delete S.errors.planes;S.loaded.planes=true;dataChanged('planes');
    },err=>{S.errors.planes=err;S.loaded.planes=true;dataChanged('planes');});}
  if(!started.clientes){started.clientes=1;watchSharded('clientes',S.clientes,'clientes');}
  if(!started.red){started.red=1;watchSharded('red',S.red,'red');}
  if(!started.ordenes){started.ordenes=1;watchSharded('ordenes',S.ordenes,'ordenes');}
  if(!started.pagos){
    if(S.realRole==='admin'||can('cobrar')||can('caja')||can('promesas')||can('resumen')){started.pagos=1;watchSharded('pagos',S.pagos,'pagos');}
    else S.loaded.pagos=true;
  }
}

function refreshAll(){
  computePerms();updateHeader();startData();
  const tabs=allowedTabs(),last=S.tab||lsGet('tab');
  showTab(tabs.some(x=>x[0]===last)?last:tabs[0][0]);
}
function onAjustesChanged(){
  const sig=()=>JSON.stringify([S.perfil&&S.perfil.id,S.perms]);
  const before=sig();
  computePerms();
  if(before!==sig()){updateHeader();startData();const tabs=allowedTabs();showTab(tabs.some(x=>x[0]===S.tab)?S.tab:tabs[0][0]);}
  else dataChanged('ajustes');
}
/* cambió mi tipo o mis permisos en el servidor */
function onMeChanged(m){
  if(!S.ready){S.me=m;return;}
  if(m.role!==S.me.role){location.reload();return;}
  S.me=m;computePerms();updateHeader();startData();
  const tabs=allowedTabs();showTab(tabs.some(x=>x[0]===S.tab)?S.tab:tabs[0][0]);
  toast('Se actualizaron tus permisos');

}
function showSetup(){
  const el=authCard(`<h2>Instalación</h2><p class="muted small">Creá la cuenta del administrador. El código de instalación (16 letras y números, en grupos de 4) te lo dio quien instaló el sistema. Se usa una sola vez.</p>
    <form class="form" id="su-form" novalidate>${F('Código de instalación','su-code','<input id="su-code" autocomplete="off" autocapitalize="characters" spellcheck="false">')}
    ${F('Nombre de la empresa','su-emp','<input id="su-emp" value="YAPUR.NET" autocomplete="off">')}
    ${F('Tu nombre','su-nom','<input id="su-nom" autocomplete="name">')}
    <div class="grid2">${F('Tu usuario','su-user','<input id="su-user" autocomplete="username" autocapitalize="none" spellcheck="false">','Sin espacios.')}${F('Tu clave','su-pass','<input id="su-pass" type="password" autocomplete="new-password">','Mínimo 8 caracteres.')}</div>
    <div class="actions"><button class="btn primary" type="submit">Crear administrador</button></div></form>`);
  $('#su-form',el).addEventListener('submit',async e=>{
    e.preventDefault();const g=i=>$('#'+i,el).value.trim();
    if(!g('su-code')||!g('su-nom')||!g('su-user')||!$('#su-pass',el).value)return toast('Completá todos los datos','bad');
    const b=$('button[type=submit]',el);b.disabled=true;
    try{await NET.setup({codigo:g('su-code'),empresa:g('su-emp'),nombre:g('su-nom'),usuario:g('su-user'),clave:$('#su-pass',el).value});lsSet('lastUser',g('su-user').toLowerCase());location.reload();}
    catch(err){b.disabled=false;toast(err.network?'No se pudo conectar con el servidor':err.message,'bad');}
  });
}

/* ===== aviso de conexión ===== */
let netT=null;
function updateNetBar(){
  const bar=$('#netBar');if(!bar)return;
  clearTimeout(netT);
  if(NET.online){bar.hidden=true;return;}
  netT=setTimeout(()=>{if(NET.online||!S.ready){bar.hidden=true;return;}bar.hidden=false;bar.textContent='Sin conexión con el servidor. Ves los últimos datos guardados y no se puede guardar nada nuevo hasta que vuelva la señal.';},2500);
}
/* botón "atrás" de Android: la envoltura nativa llama a esto; devuelve true si la app se ocupó (cerró una hoja o volvió a la primera pestaña) */
window.yapurBack=function(){
  try{
    if($('#modalRoot').firstChild){closeModal();return true;}
    if(!S.ready)return false;
    const tabs=allowedTabs();
    if(S.tab&&tabs.length&&S.tab!==tabs[0][0]){showTab(tabs[0][0]);return true;}
  }catch(e){console.error(e);}
  return false;
};

/* ===== cambio de día con la app abierta: recalcula plazos y cortes ===== */
let _dia=todayStr();
setInterval(()=>{const t=todayStr();if(t!==_dia){_dia=t;if(S.ready)dataChanged('pagos');}},60000);

/* ===== arranque ===== */
(async function boot(){
  NET.on('kick',()=>location.reload());
  NET.on('me',onMeChanged);
  NET.on('status',updateNetBar);
  let st;
  try{st=await NET.init();}catch(e){console.error(e);st={state:'noserver',error:e};}
  if(st.state!=='ready'){showAuth(st.state,st);return;}
  S.me=NET.me;S.realRole=S.me.role;S.uid=S.me.id;S.db=NET.db;
  await new Promise(res=>{
    let first=true;
    S.db.doc('ajustes/general').onSnapshot(snap=>{
      const d=snap.exists?snap.data():null;
      S.ajustes=Object.assign({empresa:'YAPUR.NET',diaVenc:10,perfiles:[],ciclos:null,feriados:null,servicios:null,promesaMax:10,precioInstalacion:PRECIOS_FIJOS_DEF.instalacion,precioReinstalacion:PRECIOS_FIJOS_DEF.reinstalacion,waAuto:true,waActivo:false},d||{},{tecnicos:[]});
      if(!Array.isArray(S.ajustes.perfiles))S.ajustes.perfiles=[];
      deriveTecnicos();delete S.errors.ajustes;S.loaded.ajustes=true;
      if(first){first=false;res();}else{rebuildDerived();onAjustesChanged();}
    },err=>{S.errors.ajustes=err;S.loaded.ajustes=true;if(first){first=false;res();}});
  });
  S.ready=true;refreshAll();updateNetBar();
  ubicInit().then(jornadaInit,jornadaInit);
})();

startUpdateWatch();

/* ===== abrir sin señal: el service worker guarda la pantalla principal (solo con https o en la propia computadora) ===== */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});});
}

</script>
