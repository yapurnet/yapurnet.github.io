<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C77">
<meta name="mobile-web-app-capable" content="yes">
<title>Gestión YAPUR.NET</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: encabezado fijo con marca y rol, pestañas con scroll propio, contenido en una columna de 980px; las fichas se abren como hoja inferior en el celular. */
:root{
  /* zonas seguras (muesca, barras del sistema): sirve tanto en el navegador como dentro de la app de Android */
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)); --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)); --sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  --bg:#EDF2F4; --surface:#FFFFFF; --surface-2:#F4F8F9; --ink:#0E2230; --muted:#587080; --line:#D3DDE3;
  --accent:#0A7C77; --accent-ink:#FFFFFF; --accent-soft:#D6EFEC; --accent-line:#9CD4CF;
  --ok:#1E8449; --ok-soft:#DDF3E4; --warn:#8F5F00; --warn-soft:#FBEFCF; --bad:#B83227; --bad-soft:#FADDD9; --info:#245FA8; --info-soft:#DCE8F7;
  --shadow:0 1px 2px rgba(14,34,48,.06),0 10px 28px rgba(14,34,48,.10); --scrim:rgba(8,20,28,.5);
  --f-display:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B171F; --surface:#12222C; --surface-2:#182E3A; --ink:#E5EEF2; --muted:#8CA3B1; --line:#25404F;
  --accent:#3CC4BB; --accent-ink:#05211F; --accent-soft:#123B3C; --accent-line:#1F6663;
  --ok:#4CC17F; --ok-soft:#143A27; --warn:#E0B04B; --warn-soft:#3D3112; --bad:#F0786C; --bad-soft:#411C18; --info:#7FB0EA; --info-soft:#172E4A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B171F; --surface:#12222C; --surface-2:#182E3A; --ink:#E5EEF2; --muted:#8CA3B1; --line:#25404F;
  --accent:#3CC4BB; --accent-ink:#05211F; --accent-soft:#123B3C; --accent-line:#1F6663;
  --ok:#4CC17F; --ok-soft:#143A27; --warn:#E0B04B; --warn-soft:#3D3112; --bad:#F0786C; --bad-soft:#411C18; --info:#7FB0EA; --info-soft:#172E4A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.62); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px;line-height:1.2} h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.right{text-align:right} .nowrap{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- encabezado y pestañas ---------- */
.top{position:sticky;top:var(--sat);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-inline:-16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-inline:-16px;padding:8px 16px 0;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{margin-left:6px;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:99px}
.wrap{max-width:980px;margin:0 auto;padding-block:18px;display:flex;flex-direction:column;gap:16px}

/* ---------- botones y chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:5px 11px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---------- tarjetas, listas, filtros ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;flex-direction:column;gap:10px}
.toolbar .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--accent-line)}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.item .tags{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.item .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.more{align-self:center}

/* ---------- formularios ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.fgroup{display:flex;flex-direction:column;gap:10px}
.fgroup>legend,.fgroup>.legend{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.hint{font-size:12px;color:var(--muted)}
.hint.bad{color:var(--bad)} .hint.ok{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions.start{justify-content:flex-start}
.geo{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px}

/* ---------- hoja modal ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-bottom:var(--sab)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,var(--sal)) 10px;border-bottom:1px solid var(--line)}
.sheet-body{overflow-y:auto;padding:14px max(16px,var(--sal)) 20px;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:88%;border-radius:16px}
  .sheet.wide{width:min(820px,calc(100% - 32px))}
}
.toasts{position:fixed;z-index:60;left:0;right:0;bottom:calc(16px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:opacity .4s}
.toast.bad{background:var(--bad);color:#fff}
.toast.out{opacity:0}

/* ---------- datos, planes, resumen ---------- */
.kv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .n{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.bad .n{color:var(--bad)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plan.off{opacity:.6}
.speed{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.speed small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.speed-up{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.price{font-family:var(--f-display);font-weight:700;font-size:20px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:56px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.now i{background:var(--accent)} .bar:not(.now) i{background:var(--accent-line)}
.bar span{font-size:11px;color:var(--muted)} .bar b{font-size:11px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.per{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.per input{margin:0;width:20px;height:20px;flex:none}
.per .grow{flex:1;min-width:0}
.receipt{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-sm);padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.ord{display:flex;flex-direction:column;gap:10px}
.ord.urgent{border-color:var(--bad)}
.stripe{display:flex;gap:6px;flex-wrap:wrap}
.qbox{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-family:var(--f-mono);font-size:12px;line-height:1.5;overflow-wrap:anywhere;color:var(--muted)}
.qsec{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.qsec>summary{cursor:pointer;font-weight:600;font-size:14px}
.qpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qpair input{min-width:0;width:100%}
.qhead{font-size:12px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:14px}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--info-soft);color:var(--info)}

/* ---------- cuenta, conexión ---------- */
button.chip{font-family:inherit;cursor:pointer}
button.chip[hidden],.netbar[hidden]{display:none}
.netbar{margin-inline:-16px;padding:6px 16px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;text-align:center;border-bottom:1px solid var(--line)}
[hidden]{display:none!important}
/* ---------- aviso de actualización ---------- */
.upd{position:fixed;z-index:70;left:0;right:0;top:var(--sat);display:flex;flex-direction:column;gap:1px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.upd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left,0px));font-size:14px;font-weight:600}
.upd-row>span:first-child{flex:1 1 220px;min-width:0}
.upd-act{display:flex;gap:6px}
.upd .btn.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent)}
.upd .btn.ghost{color:var(--accent-ink);border-color:transparent}

</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="12" width="3.5" height="6" rx="1" fill="#fff"/><rect x="8.25" y="7" width="3.5" height="11" rx="1" fill="#fff"/><rect x="14.5" y="2" width="3.5" height="16" rx="1" fill="#fff"/></svg></span>
    <div style="min-width:0"><div class="brand-name" id="brandName">YAPUR.NET</div><div class="brand-sub">Clientes, órdenes y cobranzas</div></div>
  </div>
  <div class="who"><button type="button" class="chip accent" id="roleChip" title="Mi cuenta" hidden>…</button><button class="btn small ghost" id="viewAsBtn" type="button" hidden>Ver como…</button></div>
</header>
<div id="netBar" class="netbar" hidden></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
<main id="view" class="wrap"><div class="empty"><b>Cargando…</b><span>Conectando con el servidor.</span></div></main>
<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtMoney=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(n)||0);
let _today=null;const setToday=d=>{_today=d;};
const todayStr=()=>{if(_today)return _today;const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const addMonths=(ym,n)=>{let [y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m);};
const daysIn=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const monthLabel=ym=>{const [y,m]=ym.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);};
const monthShort=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'short'}).replace('.','');};
const dateLabel=d=>{if(!d)return '';const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});};
const dmy=d=>d?d.split('-').reverse().join('/'):'';
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
/* Número con formato argentino: 17.000 = 17000 · 17.000,50 = 17000.5 · 17,5 = 17.5 · 17000 = 17000 */
const num=v=>{
  let s=String(v==null?'':v).trim().replace(/[^\d.,\-]/g,'');if(!s)return null;
  const dot=s.includes('.'),com=s.includes(',');
  if(dot&&com)s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(com)s=s.replace(',','.');
  else if(dot&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:null;
};
/* campo de dinero: muestra cómo se entiende lo que se escribe */
function bindMoney(inp,hintEl){
  if(!inp||!hintEl)return;
  const f=()=>{const raw=inp.value.trim(),n=num(raw);hintEl.textContent=raw===''?'':(n===null?'No se entiende el número.':'Se guarda '+fmtMoney(n)+'.');};
  inp.addEventListener('input',f);f();
}
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

/* ===== catálogos ===== */
const ESTADOS={activo:'Activo',suspendido:'Suspendido',pendiente:'Por instalar',baja:'Baja'};
const TECNOS={fibra:'Fibra óptica',wireless:'Antena wireless'};
const TIPOS_ORD={instalacion:'Instalación',falla:'Falla o reparación',cambio_plan:'Cambio de plan',reconexion:'Reconexión',retiro:'Retiro de equipo',visita:'Visita técnica'};
const EST_ORD={pendiente:'Pendiente',en_camino:'En camino',en_curso:'En curso',hecha:'Hecha',cancelada:'Cancelada'};
const METODOS={efectivo:'Efectivo',transferencia:'Transferencia',mercadopago:'Mercado Pago',otro:'Otro'};
const CONCEPTOS={mensualidad:'Mensualidad',instalacion:'Instalación',reconexion:'Reconexión',otro:'Otro'};

/* ===== estado global ===== */
const S={

/* ===== precios con vigencia por mes =====
   Un aumento (o un servicio nuevo en un cliente) rige desde el mes que se elige: los meses anteriores conservan lo que valían.
   plan.hist y servicio.hist = [{d:'AAAA-MM',p:precio}] ordenado: desde el mes d el precio es p.
   cliente.hp = [{h:'AAAA-MM',planId,precio,extras}] ordenado: así estaba el cliente HASTA el mes h (incluido); lo actual rige después. */
const curMonth=()=>todayStr().slice(0,7);
function histPrice(item,per){
  const h=item&&Array.isArray(item.hist)?item.hist:null;
  if(!h||!h.length)return Number(item&&item.precio)||0;
  let v=null;for(const e of h)if(e&&e.d<=per)v=e.p;
  return Number(v!==null?v:h[0].p)||0;
}
const planNow=p=>histPrice(p,curMonth());
function stateAt(c,per){
  const hp=c&&Array.isArray(c.hp)?c.hp:null;
  if(hp)for(const e of hp)if(e&&per<=e.h)return e;
  return c;
}
const hasNum=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
/* precio del plan de internet en un mes (el precio especial del cliente lo reemplaza) */
function priceBaseAt(c,per){
  const st=stateAt(c,per);
  if(hasNum(st.precio))return Number(st.precio);
  const p=S.planes.get(st.planId);return p?histPrice(p,per):0;
}
function extrasAt(c,per){
  const ids=stateAt(c,per).extras;const l=serviciosList();
  return (Array.isArray(ids)?ids:[]).map(id=>l.find(s=>s.id===id)).filter(Boolean);
}
/* total de un mes: plan de internet + servicios adicionales */
const priceAt=(c,per)=>priceBaseAt(c,per)+extrasAt(c,per).reduce((t,s)=>t+histPrice(s,per),0);

const priceBase=c=>priceBaseAt(c,curMonth());

/* nueva lista de vigencias al cambiar un precio desde el mes eff: lo anterior se conserva y lo posterior se reemplaza */
function histWith(item,eff,price){
  const h=Array.isArray(item.hist)&&item.hist.length?item.hist.filter(e=>e.d<eff):[{d:'0000-00',p:Number(item.precio)||0}];
  if(!h.length)h.push({d:'0000-00',p:Number(item.precio)||0});
  h.push({d:eff,p:price});

}

const corteBase=(per,cy)=>per+'-'+pad(Math.min(cicloCfg(cy).corte,daysIn(per)));

/* ----- facturación ----- */
function billing(c,withNext){
  const key=c.id+(withNext?'+':'');
  const hit=S.billCache.get(key);if(hit)return hit;
  const today=todayStr(),cur=today.slice(0,7);
  const out={price:priceOf(c),periods:[],vencidos:0,deuda:0,aplica:c.estado==='activo'||c.estado==='suspendido'};
  if(out.aplica){
    let from=c.desde||(c.alta?c.alta.slice(0,7):cur);
    const floor=addMonths(cur,-35);if(from<floor)from=floor;
    const paidMap=S.paidIdx.get(c.id)||new Map();
    const last=withNext?addMonths(cur,1):cur;
    const cy=cicloOf(c),cfg=cicloCfg(cy);
    for(let p=from;p<=last;p=addMonths(p,1)){
      const paid=paidMap.get(p)||0,price=priceAt(c,p),rest=Math.max(0,price-paid);
      const due=p+'-'+pad(Math.min(cfg.hasta,daysIn(p)));
      const venc=due<today;
      out.periods.push({per:p,price,paid,rest,due,venc,desde:p+'-'+pad(Math.min(cfg.desde,daysIn(p))),cut:corteFecha(p,cy)});
      if(p<=cur&&rest>0&&venc){out.vencidos++;out.deuda+=rest;}
    }
  }
  S.billCache.set(key,out);return out;
}
/* promesa de pago: la última que no fue anulada */
function promesaActual(c){const l=c&&c.promesas;if(!Array.isArray(l))return null;for(let i=l.length-1;i>=0;i--)if(l[i]&&!l[i].x)return l[i];return null;}
/* Situación de corte de un cliente:
   ok · plazo (dentro del plazo de pago) · vencido (pasó el plazo, falta para el corte) · promesa (vigente)
   cortar (hay que cortarlo) · suspendido (ya cortado y sigue debiendo) */
function cutState(c){
  const hit=S.cutCache.get(c.id);if(hit)return hit;
  const today=todayStr(),cur=today.slice(0,7),b=billing(c);
  const r={k:'ok',b,first:null,corte:null,desde:null,hasta:null,motivo:'',pr:null};
  if(b.aplica&&b.price>0){
    const first=b.periods.find(p=>p.per<=cur&&p.rest>0);
    if(first){
      const pr=promesaActual(c);r.pr=pr;r.first=first;r.corte=first.cut;
      if(pr&&today<=pr.h){
        const after=dateAdd(pr.h,1);r.k='promesa';r.hasta=pr.h;r.desde=after>first.cut?after:first.cut;
      }else{
        const porPromesa=!!pr&&pr.h>=first.due&&pr.h>=first.cut;
        r.desde=porPromesa?dateAdd(pr.h,1):first.cut;
        if(today>=r.desde){
          r.k=c.estado==='suspendido'?'suspendido':'cortar';
          r.motivo=porPromesa?'Venció la promesa del '+dm(pr.h):'Pasó la fecha de corte del '+dm(first.cut);
        }else r.k=first.venc?'vencido':'plazo';
      }
    }
  }
  S.cutCache.set(c.id,r);return r;
}
/* suspendido por mora en la app y ya sin motivo para seguir cortado */
const aReconectar=c=>c.estado==='suspendido'&&!!c.corteMora&&['ok','plazo','vencido','promesa'].includes(cutState(c).k);

}

/* ===== coordenadas y enlaces ===== */
function parseCoords(text){
  if(!text)return null;
  let t=String(text).trim().replace(/%2C/gi,',');
  if(/^-?\d+,\d+\s+-?\d+,\d+$/.test(t))t=t.replace(/,/g,'.');
  const m=t.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/)
    ||t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)
    ||t.match(/[?&](?:q|ll|query|destination|center)=\+?(-?\d+(?:\.\d+)?),\s*\+?(-?\d+(?:\.\d+)?)/)
    ||t.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!m)return null;
  let lat=parseFloat(m[1]),lng=parseFloat(m[2]);
  if(!isFinite(lat)||!isFinite(lng))return null;
  let fixed=false;
  if(lat>0&&lng>0&&lat>=21&&lat<=56&&lng>=53&&lng<=74){lat=-lat;lng=-lng;fixed=true;}
  if(Math.abs(lat)>90||Math.abs(lng)>180)return null;
  const inAR=lat<=-21&&lat>=-56&&lng<=-53&&lng>=-74;
  return {lat:+lat.toFixed(6),lng:+lng.toFixed(6),fixed,outside:!inAR};
}

const toCsv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');

/* ===== conexión con el servidor =====
   Reemplaza la base de datos de Claude: misma interfaz (collection/doc/onSnapshot/update/set),
   pero los datos viven en el servidor (Cloudflare). La app se sirve desde la misma dirección que la API,
   así que no hace falta configurar nada. Las colecciones se sincronizan completas al entrar y después
   llegan los cambios en vivo. Se guarda una copia local (sin pagos) para abrir sin señal. */
const NET=(function(){
  /* dentro del APK, la envoltura de Android expone window.YapurApp (guardar archivos, abrir enlaces, botón atrás) */
  const bridge=window.YapurApp||null;
  const native=!!bridge;
  const base='';
  let token=lsGet('tok')||'';
  let me=null;try{me=JSON.parse(lsGet('me')||'null');}catch(e){}
  if(!token)me=null;
  const data={};                 // coll -> Map(id -> objeto) | null si no tiene acceso
  const docSeq=new Map();
  let baseSeq=0,synced=false,syncing=null,buffer=[],started=false;
  let es=null,esTimer=null,lastMsg=0,online=false,retry=0,retryT=null,persistT=null,dirty=new Set(),flushT=null;
  const watchers=new Set();
  const handlers={status:[],me:[],kick:[]};
  const emit=(k,v)=>handlers[k].forEach(f=>{try{f(v);}catch(e){console.error(e);}});

  const isPlain=o=>o&&typeof o==='object'&&!Array.isArray(o);
  const BAD=new Set(['__proto__','constructor','prototype']);
  function deepMerge(a,b){
    if(!isPlain(a)||!isPlain(b))return b;
    const out=Object.assign({},a);
    for(const k of Object.keys(b)){if(BAD.has(k))continue;out[k]=isPlain(b[k])&&isPlain(out[k])?deepMerge(out[k],b[k]):b[k];}
    return out;
  }

  /* ----- pedidos ----- */
  function netErr(msg){const e=new Error(msg||'Sin conexión con el servidor.');e.code='unavailable';e.network=true;return e;}
  async function api(method,path,body,opt){
    opt=opt||{};
    const ctl=typeof AbortController!=='undefined'?new AbortController():null;
    const tm=ctl?setTimeout(()=>ctl.abort(),opt.timeout||25000):null;
    let r;
    try{
      r=await fetch(base+path,{method,signal:ctl?ctl.signal:undefined,headers:Object.assign({'Content-Type':'application/json'},token&&!opt.anon?{Authorization:'Bearer '+token}:{}),body:body===undefined?undefined:JSON.stringify(body)});
    }catch(e){throw netErr();}
    finally{if(tm)clearTimeout(tm);}
    let j=null;try{j=await r.json();}catch(e){}
    if(!r.ok){
      const e=new Error((j&&j.error)||'No se pudo completar la operación.');
      e.status=r.status;e.code=(j&&j.code)||'invalid_argument';
      if(r.status===401&&token&&!opt.noKick)lost('Tu sesión terminó. Entrá de nuevo.');
      throw e;
    }
    return j;
  }
  function lost(msg){
    if(!token)return;
    try{sessionStorage.setItem('yg_msg',msg||'');}catch(e){}
    clearSession();
    emit('kick',msg);
  }

  /* ----- sesión ----- */
  function setSession(t,m){token=t;me=m;lsSet('tok',t);lsSet('me',JSON.stringify(m));}
  function clearSession(){
    token='';me=null;lsSet('tok','');lsSet('me','');['viewAsP','tab','tecId','sess'].forEach(k=>lsSet(k,''));
    closeStream();synced=false;started=false;for(const k of Object.keys(data))delete data[k];
    kvClear();
  }
  async function login(usuario,clave){const j=await api('POST','/api/login',{usuario,clave},{anon:true,noKick:true});setSession(j.token,j.me);return j.me;}
  async function setup(b){const j=await api('POST','/api/setup',b,{anon:true,noKick:true});setSession(j.token,j.me);return j.me;}
  async function logout(){try{if(token)await api('POST','/api/logout',{},{noKick:true,timeout:5000});}catch(e){}clearSession();}
  async function status(){return api('GET','/api/status',undefined,{anon:true,noKick:true,timeout:9000});}
  /* ----- copia local para abrir sin señal (los pagos no se guardan en el equipo) ----- */
  function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('yapur-gestion',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
  async function kvGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return null;}}
  async function kvSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
  async function kvClear(){try{const d=await idb();await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=res;t.onerror=res;});}catch(e){}}
  const cacheKey=()=>'cache:'+location.origin+':'+(me?me.id:'');
  function persistSoon(){
    if(!me||!synced||persistT)return;
    persistT=setTimeout(()=>{
      persistT=null;if(!me||!synced)return;
      const cols={};
      for(const c of ['clientes','ordenes','planes','ajustes','red'])if(data[c])cols[c]=[...data[c]];
      kvSet(cacheKey(),{ts:Date.now(),cols});
    },4000);
  }
  async function loadCache(){
    const c=await kvGet(cacheKey());
    if(!c||!c.cols||!c.cols.ajustes)return false;
    for(const k of Object.keys(c.cols))data[k]=new Map(c.cols[k]);
    for(const k of ['clientes','ordenes','planes','ajustes','red'])if(!data[k])data[k]=new Map();
    synced=true;baseSeq=0;docSeq.clear();
    return true;
  }

  /* ----- sincronización ----- */
  function markAll(){['clientes','pagos','ordenes','planes','ajustes','red'].forEach(c=>dirty.add(c));kick();}
  function kick(){if(flushT)return;flushT=setTimeout(()=>{flushT=null;flush();},20);}
  function flush(){
    const d=dirty;dirty=new Set();
    for(const w of [...watchers])if(d.has(w.coll))fire(w);
    persistSoon();
  }
  function fullSync(){
    if(syncing)return syncing;
    syncing=(async()=>{
      buffer=[];
      const j=await api('GET','/api/sync',undefined,{timeout:90000});
      for(const k of Object.keys(data))delete data[k];
      for(const c of ['clientes','pagos','ordenes','planes','ajustes','red'])data[c]=null;
      for(const c of Object.keys(j.cols))data[c]=new Map(j.cols[c].map(d=>[d.id,d.data]));
      baseSeq=j.seq;docSeq.clear();synced=true;
      const pend=buffer;buffer=[];
      pend.forEach(m=>applyDoc(m.coll,m.id,m.op,m.data,m.seq,true));
      markAll();
    })().finally(()=>{syncing=null;});
    return syncing;
  }
  function applyDoc(coll,id,op,d,seq,quiet){
    const k=coll+'/'+id;
    if(seq<=(docSeq.has(k)?docSeq.get(k):baseSeq))return;
    docSeq.set(k,seq);
    const m=data[coll]||(data[coll]=new Map());
    m.set(id,op==='set'||!m.has(id)?d:deepMerge(m.get(id),d));
    if(!quiet){dirty.add(coll);kick();}
    else dirty.add(coll);
  }

  /* ----- tiempo real ----- */
  function setOnline(v){if(online===v)return;online=v;emit('status',v);}
  function closeStream(){if(es){try{es.close();}catch(e){}es=null;}if(esTimer){clearInterval(esTimer);esTimer=null;}}
  function scheduleReconnect(){
    if(retryT||!token)return;
    const wait=Math.min(20000,1500*Math.pow(1.6,retry++));
    retryT=setTimeout(()=>{retryT=null;connectStream();},wait);
  }
  async function connectStream(){
    if(es||!token)return;
    let t;
    try{t=(await api('POST','/api/ticket',{},{timeout:10000})).t;}
    catch(e){setOnline(false);if(token)scheduleReconnect();return;}
    if(es||!token)return;
    const s=new EventSource(base+'/api/stream?t='+encodeURIComponent(t));
    es=s;lastMsg=Date.now();
    const seen=()=>{lastMsg=Date.now();};
    s.addEventListener('hello',()=>{seen();retry=0;setOnline(true);if(started)fullSync().catch(()=>{});});
    s.addEventListener('ping',seen);
    s.addEventListener('doc',ev=>{seen();let m;try{m=JSON.parse(ev.data);}catch(e){return;}if(syncing)buffer.push(m);else applyDoc(m.coll,m.id,m.op,m.data,m.seq);});
    s.addEventListener('me',ev=>{seen();try{const m=JSON.parse(ev.data);me=m;lsSet('me',JSON.stringify(m));emit('me',m);}catch(e){}});
    s.addEventListener('kick',()=>{lost('Tu acceso fue desactivado o cambiado. Entrá de nuevo.');});
    s.onerror=()=>{if(es!==s)return;closeStream();setOnline(false);scheduleReconnect();};
    esTimer=setInterval(()=>{if(es===s&&Date.now()-lastMsg>70000){closeStream();setOnline(false);connectStream();}},15000);
  }
  /* al volver a la app o recuperar la red: se asegura de estar al día */
  function wake(){
    if(!token||!synced)return;
    if(!es){retry=0;if(retryT){clearTimeout(retryT);retryT=null;}connectStream();}
    else if(Date.now()-lastMsg>45000){closeStream();setOnline(false);retry=0;connectStream();}
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
  window.addEventListener('online',wake);
  setInterval(()=>{if(token&&synced&&!es&&!document.hidden)wake();},30000);

  /* ----- arranque: devuelve en qué pantalla hay que estar ----- */
  async function bring(){
    /* conecta el stream primero y recién ahí sincroniza: no se pierde ningún cambio en el medio */
    await connectStream();
    await fullSync();
    started=true;
  }
  async function init(){
    if(token&&me){
      const cached=await loadCache();
      if(cached){
        (async()=>{
          try{
            const j=await api('GET','/api/me',undefined,{timeout:15000});
            if(!token)return;
            const changed=JSON.stringify(j.me)!==JSON.stringify(me);
            me=j.me;lsSet('me',JSON.stringify(me));if(changed)emit('me',me);
            await bring();setOnline(true);
          }catch(e){if(e.network){setOnline(false);started=true;scheduleReconnect();}else if(e.status!==401)console.error(e);}
        })();
        return {state:'ready',stale:true};
      }
      try{
        const j=await api('GET','/api/me',undefined,{timeout:15000});
        me=j.me;lsSet('me',JSON.stringify(me));
        await bring();setOnline(true);
        return {state:'ready'};
      }catch(e){
        if(e.network)return {state:'offline'};
        if(e.status===401||!token){return await loginState();}
        throw e;
      }
    }
    return await loginState();
  }
  async function loginState(){
    try{const st=await status();return {state:st.needsSetup?'setup':'login'};}
    catch(e){return {state:'noserver',error:e};}
  }

  /* ----- vigilantes de datos con la interfaz de la base anterior ----- */
  function snapOf(w){
    if(w.id==null){
      const m=data[w.coll];
      return {docs:m?[...m].map(([id,d])=>({id,data:()=>d})):[],size:m?m.size:0};
    }
    const m=data[w.coll],d=m&&m.get(w.id);
    return {exists:!!d,id:w.id,data:()=>d||undefined};
  }
  function fire(w){
    if(!synced)return;
    if(data[w.coll]==null){if(w.err)w.err({code:'permission_denied'});return;}
    try{w.cb(snapOf(w));}catch(e){console.error(e);}
  }
  function watch(coll,id,cb,err){
    const w={coll,id,cb,err};watchers.add(w);
    if(synced)setTimeout(()=>{if(watchers.has(w))fire(w);},0);
    return ()=>watchers.delete(w);
  }
  async function write(coll,id,method,obj){
    const j=await api(method,'/api/doc/'+coll+'/'+encodeURIComponent(id),{data:obj});
    if(j.data!=null)applyDoc(coll,id,j.op,j.data,j.seq);
    return j;
  }
  const docRef=(coll,id)=>({
    update:obj=>write(coll,id,'PATCH',obj),
    set:obj=>write(coll,id,'PUT',obj),
    onSnapshot:(cb,err)=>watch(coll,id,cb,err)
  });
  const dbApi={
    collection:coll=>({doc:id=>docRef(coll,id),onSnapshot:(cb,err)=>watch(coll,null,cb,err)}),
    doc:path=>{const [c,i]=String(path).split('/');return docRef(c,i);}
  };

  /* ----- archivos y enlaces (en el celular se guarda en Descargas; en el navegador se descarga) ----- */
  async function saveFile(filename,text){
    const mime=/\.json$/i.test(filename)?'application/json':'text/csv';
    if(bridge&&typeof bridge.saveFile==='function'){
      const r=String(bridge.saveFile(filename,mime,String(text))||'');
      if(r.indexOf('ok:')!==0)throw new Error(r||'No se pudo guardar el archivo.');
      return r.slice(3)||'ok';
    }
    const blob=new Blob([text],{type:mime+(mime==='text/csv'?';charset=utf-8':'')});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    return 'ok';
  }
  /* en la app de Android los enlaces de WhatsApp, mapas y llamadas se abren afuera, sin sacar a la persona de la app */
  if(native){
    document.addEventListener('click',e=>{
      const a=e.target.closest&&e.target.closest('a[href]');if(!a||e.defaultPrevented)return;
      const h=a.getAttribute('href')||'';
      if(/^(https?:|geo:|tel:|whatsapp:|waze:|intent:|mailto:|sms:)/i.test(h)&&(a.target==='_blank'||!h.startsWith(location.origin))&&typeof bridge.openUrl==='function'){
        e.preventDefault();bridge.openUrl(h);
      }
    },true);
  }
  return {
    native,get base(){return base;},get me(){return me;},get token(){return token;},get online(){return online;},get synced(){return synced;},
    api,init,bring,login,setup,logout,status,saveFile,
    get appVersion(){try{return bridge&&typeof bridge.version==='function'?String(bridge.version()||''):'';}catch(e){return '';}},
    openExternal:url=>{if(bridge&&typeof bridge.openUrl==='function')bridge.openUrl(String(url));else window.open(url,'_blank','noopener');},
    db:dbApi,
    on:(k,f)=>{handlers[k].push(f);},
    hasSession:()=>!!token
  };
})();

/* ===== clientes ===== */
const VIEWS={};
const CL={q:'',estado:'todos',plan:'',tec:'',limit:50};
const ESTADO_CLS={activo:'ok',suspendido:'bad',pendiente:'info',baja:''};
const planName=id=>{const p=S.planes.get(id);return p?p.nombre:'Sin plan';};
const planSpeed=p=>p?`${p.bajada}/${p.subida} Mbps`:'';
function clientHay(c){
  const hv=S.pv+'.'+S.rv;
  if(!c._hay||c._hayV!==hv){c._hay=norm([c.codigo,c.nombre,can('dni')?c.dni:'',can('telefono')?c.tel:'',can('telefono')?c.tel2:'',c.dir,c.loc,c.usuario,c.ip,c.nodo,c.equipo,c.nap?redName(c.nap):''].join(' '));c._hayV=hv;}
  return c._hay;
}
function visibleSet(){
  const s=new Set();
  for(const o of S.ordenes.values())if(ORD_OPEN(o)&&(!o.tecnico||o.tecnico===S.tecId))s.add(o.clientId);
  return s;
}
const clientVisible=c=>can('clientesTodos')||visibleSet().has(c.id);
function searchClients(q,filter,limit){
  const parts=norm(q).trim().split(/\s+/).filter(Boolean);
  const out=[];const vis=can('clientesTodos')?null:visibleSet();
  for(const c of S.clientes.values()){
    if(vis&&!vis.has(c.id))continue;
    if(filter&&!filter(c))continue;
    if(parts.length){const h=clientHay(c);if(!parts.every(p=>h.includes(p)))continue;}
    out.push(c);
  }
  out.sort((a,b)=>norm(a.nombre).localeCompare(norm(b.nombre)));
  return limit?out.slice(0,limit):out;
}
function clientRow(c){
  const pl=S.planes.get(c.planId);
  return `<button class="item" type="button" data-open-client="${esc(c.id)}">
    <div><div class="t">${esc(c.nombre)}${c.codigo?` <span class="muted mono small">#${esc(c.codigo)}</span>`:''}</div>
    <div class="s">${esc(c.dir||'Sin domicilio')}${c.loc?' · '+esc(c.loc):''}</div></div>
    <div class="side"><span class="chip ${ESTADO_CLS[c.estado]||''}">${esc(ESTADOS[c.estado]||c.estado)}</span></div>
    <div class="tags">${pl?`<span class="chip accent">${esc(pl.nombre)} · ${esc(planSpeed(pl))}</span>`:(extrasOf(c).length?'':'<span class="chip warn">Sin plan</span>')}${extrasOf(c).map(s=>`<span class="chip info">${esc(s.nombre)}</span>`).join('')}
    ${c.tec?`<span class="chip">${esc(TECNOS[c.tec]||c.tec)}</span>`:''}${c.nap&&redName(c.nap)?`<span class="chip">${esc(redName(c.nap))}${c.napPuerto?' · p. '+esc(c.napPuerto):''}</span>`:''}
    ${hasGeo(c)?'':'<span class="chip warn">Sin ubicación</span>'}${billChip(c)}</div></button>`;
}
function mountClientPicker(host,opts){
  host.innerHTML=`<input type="search" class="cp-in" placeholder="${esc(opts.placeholder||'Buscar por nombre, DNI, N° de cliente, teléfono o usuario')}" autocomplete="off" aria-label="Buscar cliente"><div class="list cp-list" style="margin-top:8px"></div>`;
  const inp=$('.cp-in',host),list=$('.cp-list',host);
  const draw=()=>{
    const q=inp.value.trim();
    if(!q){list.innerHTML='';return;}
    const rows=searchClients(q,opts.filter,8);
    list.innerHTML=rows.length?rows.map(c=>`<button class="item" type="button" data-pick="${esc(c.id)}"><div><div class="t">${esc(c.nombre)}${c.codigo?` <span class="muted mono small">#${esc(c.codigo)}</span>`:''}</div><div class="s">${esc(c.dir||'')}${c.loc?' · '+esc(c.loc):''}</div></div><div class="side">${billChip(c)}</div></button>`).join(''):'<div class="hint">No hay clientes con esa búsqueda.</div>';
  };
  inp.addEventListener('input',draw);
  list.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b)opts.onPick(S.clientes.get(b.dataset.pick));});
  return {focus:()=>inp.focus(),draw};
}

/* ----- campo de ubicación ----- */
function geoFieldHTML(c,msg){
  const v=hasGeo(c)?parseFloat(c.lat).toFixed(6)+', '+parseFloat(c.lng).toFixed(6):'';
  return `<div class="geo"><div class="field"><label for="cf-geo">Ubicación (coordenadas o link de Google Maps)</label>
    <input id="cf-geo" type="text" autocomplete="off" inputmode="text" placeholder="-27.7345, -62.4678" value="${esc(v)}">
    <div class="hint" id="cf-geo-hint"></div></div>
    <div class="actions start"><button class="btn small" type="button" id="cf-gps">Usar mi ubicación actual (GPS)</button></div>
    <div class="hint" id="cf-gps-st">${esc(msg||'Si estás en el domicilio del cliente, tocá el botón y se completa solo.')}</div></div>`;
}
/* ----- GPS del celular: toma lecturas unos segundos y se queda con la más precisa ----- */
function gpsStart(onProgress){
  let best=null,done=false,lastErr=null,timer=null,id=null,res,rej;
  const promise=new Promise((a,b)=>{res=a;rej=b;});
  const finish=err=>{
    if(done)return;done=true;
    try{if(id!==null)navigator.geolocation.clearWatch(id);}catch(e){}
    clearTimeout(timer);
    if(best)res(best);else rej(err||lastErr||{code:3});
  };
  if(!navigator.geolocation){done=true;rej({code:0});return {promise,stop(){}};}
  try{
    id=navigator.geolocation.watchPosition(p=>{
      const c=p.coords,r={lat:c.latitude,lng:c.longitude,acc:Number(c.accuracy)||0};
      if(!isFinite(r.lat)||!isFinite(r.lng))return;
      if(!best||r.acc<=best.acc)best=r;
      if(onProgress)onProgress(best);
      if(best.acc<=10)finish();
    },e=>{lastErr=e;if(e&&e.code===1)finish(e);},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  }catch(e){done=true;rej({code:0});return {promise,stop(){}};}
  timer=setTimeout(()=>finish(),25000);
  return {promise,stop:()=>finish()};
}
function gpsErrorText(e){
  const c=e&&e.code;
  if(c===0)return 'Este navegador no permite usar el GPS.';
  if(c===1)return NET.native
    ?'No hay permiso de ubicación. En el celular: Ajustes → Aplicaciones → Gestión YAPUR → Permisos → Ubicación → Permitir (con ubicación precisa). Si ya está permitido, falta instalar la versión nueva del APK.'
    :'El navegador no tiene permiso de ubicación. Tocá el candado junto a la dirección y permitila.';
  return 'No se pudo obtener la ubicación'+(c===3?' (tardó demasiado)':'')+'. Activá el GPS del celular (Ubicación) y probá de nuevo, mejor al aire libre.';
}
function bindGeoField(root){
  const inp=$('#cf-geo',root),hint=$('#cf-geo-hint',root);
  const read=()=>{
    const t=inp.value.trim();
    if(!t)return {empty:true};
    const g=parseCoords(t);
    return g||{invalid:true,short:/goo\.gl|maps\.app/i.test(t)};
  };
  const draw=()=>{
    const g=read();
    if(g.empty){hint.className='hint';hint.textContent='En Google Maps mantené apretado el punto y copiá los números que aparecen arriba. También sirve pegar el link que manda el cliente por WhatsApp.';}
    else if(g.invalid){hint.className='hint bad';hint.textContent=g.short?'Los links cortos (maps.app.goo.gl) no traen coordenadas. Abrilo en Maps y copiá los números.':'No se reconoce. Pegá dos números separados por coma, por ejemplo -27.7345, -62.4678.';}
    else{hint.className='hint '+(g.outside?'bad':'ok');hint.textContent='Se guarda '+g.lat+', '+g.lng+(g.fixed?'. Se corrigió el signo: en Argentina son negativos.':'')+(g.outside?'. Queda fuera de Argentina, revisalo.':'.');}
  };
  inp.addEventListener('input',draw);draw();
  const btn=$('#cf-gps',root),st=$('#cf-gps-st',root);
  if(btn&&st){
    let run=null;const label=btn.textContent;
    const say=(cls,txt)=>{st.className='hint '+cls;st.textContent=txt;};
    btn.addEventListener('click',async()=>{
      if(run){run.stop();return;}   /* segundo toque: usar lo mejor que haya hasta ahora */
      btn.textContent='Buscando señal… (tocá para usar lo mejor hasta ahora)';
      say('','Esperando al GPS. Mejor al aire libre y frente a la casa.');
      run=gpsStart(b=>say('','Buscando… precisión actual ±'+Math.round(b.acc)+' m'));
      try{
        const r=await run.promise,m=Math.round(r.acc);
        inp.value=r.lat.toFixed(6)+', '+r.lng.toFixed(6);
        inp.dispatchEvent(new Event('input',{bubbles:true}));
        say(r.acc<=25?'ok':'bad',r.acc<=25?'Ubicación tomada con el GPS (±'+m+' m). Revisala y guardá.':'Ubicación tomada, pero poco precisa (±'+m+' m). Salí a un lugar abierto y repetí.');
      }catch(e){say('bad',gpsErrorText(e));}
      finally{run=null;btn.textContent=label;}
    });
  }
  return read;
}

/* ----- ficha ----- */
function stripInternal(o){const r=Object.assign({},o);delete r.id;delete r._doc;delete r._hay;delete r._hayV;return r;}
async function saveClient(c,patch){
  const obj=Object.assign(stripInternal(c),patch,{mod:Date.now()});
  await putItem('clientes',clientShard(c.id),c.id,obj);
  return obj;
}

/* ----- promesas de pago en la ficha ----- */
function promesaBlock(c,owes){

    ${hist.length?`<div class="tbl-wrap" style="margin-top:8px"><table><tbody>${hist.map(h=>`<tr><td class="nowrap">${dmy(h.f)}</td><td>${h.d} ${h.d===1?'día':'días'}, hasta el ${dmy(h.h)}${h.n?' · '+esc(h.n):''}</td><td class="right">${h.x?'<span class="chip">Anulada</span>':(h===pr&&vig?'<span class="chip warn">Vigente</span>':'')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="hint">${owes?'No tiene promesas registradas.':'No tiene deuda: no necesita promesa.'}</div>`}</div>`;

function openGeoQuick(id){
  const c=S.clientes.get(id);if(!c)return;
  if(!can('ubicacion'))return toast('Tu perfil no puede cargar ubicaciones','bad');
  openModal({title:'Ubicación de '+c.nombre,html:`${geoFieldHTML(c)}<div class="actions"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="button" id="geo-save">Guardar ubicación</button></div>`,onMount(el){
    const read=bindGeoField(el);
    $('#geo-save',el).addEventListener('click',async()=>{
      const g=read();
      if(g.invalid)return toast('Las coordenadas no son válidas','bad');
      try{await saveClient(c,{lat:g.empty?null:g.lat,lng:g.empty?null:g.lng});toast('Ubicación guardada');closeModal();}catch(e){dbError(e);}
    });
  }});
}

/* ----- alta y edición ----- */
function nextCodigo(){let m=0;for(const c of S.clientes.values()){const n=parseInt(c.codigo,10);if(isFinite(n)&&n>m)m=n;}return String(m+1);}
const F=(label,id,inner,hint)=>`<div class="field"><label for="${id}">${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
const opt=(v,l,sel)=>`<option value="${esc(v)}"${sel?' selected':''}>${esc(l)}</option>`;
/* los cambios de un cliente solo pueden regir después de que empezó su situación actual (si no, se reescribiría el pasado) */
const cfVigMin=c=>{const hp=c&&Array.isArray(c.hp)?c.hp:[];return hp.length?addMonths(hp[hp.length-1].h,1):'';};
const sameExtras=(a,b)=>JSON.stringify([...(a||[])].sort())===JSON.stringify([...(b||[])].sort());
function openClientForm(id){
  const old=id?S.clientes.get(id):null;
  const full=can('editarClientes');
  if(!full&&!can('ubicacion'))return toast('Tu perfil no puede editar clientes','bad');
  if(!old&&!full)return toast('Tu perfil no puede dar de alta clientes','bad');
  const c=old||{estado:'activo',alta:todayStr(),desde:todayStr().slice(0,7),ciclo:1,codigo:nextCodigo()};
  const svcs=serviciosList().filter(s=>s.activo!==false||(c.extras||[]).includes(s.id));
  const plans=[...S.planes.values()].filter(p=>p.activo!==false||p.id===c.planId).sort((a,b)=>(a.bajada-b.bajada)||(planNow(a)-planNow(b)));
  const html=`<form class="form" id="cform" novalidate>
    ${full?`<fieldset class="fgroup" style="border:0;padding:0;margin:0"><legend>Datos del cliente</legend>
      <div class="grid2">${F('Nombre y apellido *','cf-nombre',`<input id="cf-nombre" value="${esc(c.nombre||'')}" autocomplete="off">`)}${F('N° de cliente','cf-codigo',`<input id="cf-codigo" class="mono" value="${esc(c.codigo||'')}">`)}</div>
      <div class="grid2">${F('DNI','cf-dni',`<input id="cf-dni" inputmode="numeric" class="mono" value="${esc(c.dni||'')}">`)}${F('Teléfono *','cf-tel',`<input id="cf-tel" inputmode="tel" value="${esc(c.tel||'')}" placeholder="3844 56-2605">`,'Con código de área, sin 0 ni 15. Se usa para WhatsApp.')}</div>
      ${F('Otro teléfono','cf-tel2',`<input id="cf-tel2" inputmode="tel" value="${esc(c.tel2||'')}">`)}</fieldset>`:''}
    <fieldset class="fgroup" style="border:0;padding:0;margin:0"><legend>Domicilio</legend>
      ${full?`<div class="grid2">${F('Calle y número *','cf-dir',`<input id="cf-dir" value="${esc(c.dir||'')}">`)}${F('Barrio o localidad','cf-loc',`<input id="cf-loc" value="${esc(c.loc||'')}">`)}</div>`:''}
      ${F('Referencia para llegar','cf-ref',`<input id="cf-ref" value="${esc(c.ref||'')}" placeholder="Portón verde, frente a la plaza…">`)}
      ${geoFieldHTML(c)}</fieldset>
    <fieldset class="fgroup" style="border:0;padding:0;margin:0"><legend>Servicio</legend>
      ${full?`<div class="grid2">${F('Plan','cf-plan',`<select id="cf-plan"><option value="">Sin plan</option>${plans.map(p=>opt(p.id,`${p.nombre} · ${p.bajada}/${p.subida} Mbps · ${fmtMoney(planNow(p))}`,p.id===c.planId)).join('')}</select>`)}${F('Estado','cf-estado',`<select id="cf-estado">${Object.entries(ESTADOS).map(([k,v])=>opt(k,v,k===c.estado)).join('')}</select>`)}</div>`:''}
      ${full&&svcs.length?`<div class="field"><label>Servicios adicionales</label><div class="list" id="cf-extras">${svcs.map(s=>`<label class="per"><input type="checkbox" data-extra="${esc(s.id)}"${(c.extras||[]).includes(s.id)?' checked':''}><span class="grow"><b>${esc(s.nombre)}</b>${s.activo===false?' <span class="small muted">(ya no se ofrece)</span>':''}</span>${can('precios')?`<b class="tnum">${fmtMoney(planNow(s))}</b>`:''}</label>`).join('')}</div></div>`:''}
      ${full&&can('precios')?'<div class="hint" id="cf-total"></div>':''}
      ${full&&old?`<div class="notice info" id="cf-vig" hidden><div class="field"><label for="cf-vig-mes">Los cambios de plan, precio o servicios rigen desde</label><input id="cf-vig-mes" type="month" max="${curMonth()}" value="${curMonth()}"${cfVigMin(old)?` min="${cfVigMin(old)}"`:''}></div>
        <div class="hint">Los meses anteriores quedan como estaban: lo que ya pagó no se vuelve deuda.</div>
        <label class="per"><input id="cf-vig-fix" type="checkbox"><span class="grow">Es un error de carga: corregir todos los meses</span></label></div>`:''}
      <div class="grid2">${F('Tecnología','cf-tec',`<select id="cf-tec"><option value="">Sin definir</option>${Object.entries(TECNOS).map(([k,v])=>opt(k,v,k===c.tec)).join('')}</select>`)}${F('Usuario (PPPoE o similar)','cf-usuario',`<input id="cf-usuario" class="mono" autocomplete="off" value="${esc(c.usuario||'')}">`)}</div>
      <div class="grid2">${F('IP del cliente','cf-ip',`<input id="cf-ip" class="mono" inputmode="decimal" autocomplete="off" placeholder="192.168.100.4" value="${esc(c.ip||'')}">`,'Es el target de su cola en MikroTik.')}${F('Nodo o torre','cf-nodo',`<input id="cf-nodo" value="${esc(c.nodo||'')}">`)}</div>
      ${F('Equipo (serie de ONU o MAC)','cf-equipo',`<input id="cf-equipo" class="mono" value="${esc(c.equipo||'')}">`)}
      ${can('red')?napFieldHTML(c):''}</fieldset>
    ${full?`<fieldset class="fgroup" style="border:0;padding:0;margin:0"><legend>Facturación</legend>
      <div class="grid2">${F('Fecha de alta','cf-alta',`<input id="cf-alta" type="date" value="${esc(c.alta||'')}">`)}${F('Cobrar desde (mes)','cf-desde',`<input id="cf-desde" type="month" value="${esc(c.desde||'')}">`,'Antes de este mes no se genera deuda.')}</div>
      <div class="grid2">${F('Ciclo de cobro','cf-ciclo',`<select id="cf-ciclo">${[1,2].map(n=>opt(n,'Ciclo '+n+': '+cicloTxt(n),cicloOf(c)===n)).join('')}</select>`)}${F('Precio especial del plan (opcional)','cf-precio',`<input id="cf-precio" type="text" inputmode="decimal" autocomplete="off" value="${c.precio==null?'':esc(c.precio)}">`,'Reemplaza el precio del plan de internet; los servicios adicionales se suman aparte. <span id="cf-precio-h"></span>')}</div>
      ${F('Notas','cf-notas',`<textarea id="cf-notas">${esc(c.notas||'')}</textarea>`)}</fieldset>`:''}
    <div class="actions"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`;
  openModal({title:old?'Editar cliente':'Nuevo cliente',html,onMount(el){
    const read=bindGeoField(el);const readNap=bindNapField(el,old&&old.id);const v=i=>{const n=$('#'+i,el);return n?n.value.trim():undefined;};
    bindMoney($('#cf-precio',el),$('#cf-precio-h',el));
    const upd=()=>{const t=$('#cf-total',el);if(!t)return;const pv=v('cf-precio');t.textContent='Total por mes: '+fmtMoney(priceOf({planId:v('cf-plan')||null,precio:pv?num(pv):null,extras:$$('[data-extra]',el).filter(i=>i.checked).map(i=>i.dataset.extra)}));};
    const billChanged=()=>{
      if(!old||!full)return false;
      const pv=v('cf-precio'),ex=$$('[data-extra]',el);
      return (v('cf-plan')||null)!==(old.planId||null)||String(pv===''?'':num(pv))!==String(hasNum(old.precio)?Number(old.precio):'')||(ex.length&&!sameExtras(ex.filter(i=>i.checked).map(i=>i.dataset.extra),old.extras));
    };
    const vig=()=>{const b=$('#cf-vig',el);if(b)b.hidden=!billChanged();};
    ['cf-plan','cf-precio'].forEach(i=>{const n=$('#'+i,el);if(n){n.addEventListener('input',upd);n.addEventListener('change',upd);n.addEventListener('input',vig);n.addEventListener('change',vig);}});
    $$('[data-extra]',el).forEach(i=>{i.addEventListener('change',upd);i.addEventListener('change',vig);});upd();vig();
    $('#cform',el).addEventListener('submit',async e=>{
      e.preventDefault();
      const g=read();if(g.invalid)return toast('Revisá las coordenadas','bad');
      const patch={ref:v('cf-ref'),lat:g.empty?null:g.lat,lng:g.empty?null:g.lng,tec:v('cf-tec')||null,usuario:v('cf-usuario'),ip:v('cf-ip'),nodo:v('cf-nodo'),equipo:v('cf-equipo')};
      const nf=readNap();if(nf){if(nf.bad)return toast(nf.bad,'bad');patch.nap=nf.nap;patch.napPuerto=nf.puerto;}
      if(full){
        if(!v('cf-nombre'))return toast('Falta el nombre','bad');
        if(!v('cf-dir'))return toast('Falta el domicilio','bad');
        if(!v('cf-tel'))return toast('Falta el teléfono','bad');
        const cod=v('cf-codigo');
        if(cod&&[...S.clientes.values()].some(x=>x.codigo===cod&&x.id!==(old&&old.id)))return toast('Ese N° de cliente ya existe','bad');
        const precio=v('cf-precio');
        if(precio!==''&&num(precio)===null)return toast('El precio especial no se entiende','bad');
        Object.assign(patch,{nombre:v('cf-nombre'),codigo:cod,dni:v('cf-dni'),tel:v('cf-tel'),tel2:v('cf-tel2'),dir:v('cf-dir'),loc:v('cf-loc'),planId:v('cf-plan')||null,estado:v('cf-estado'),
          alta:v('cf-alta')||todayStr(),desde:v('cf-desde')||todayStr().slice(0,7),ciclo:Number(v('cf-ciclo'))===2?2:1,precio:precio===''?null:num(precio),notas:v('cf-notas')});
      }
      if(patch.estado&&patch.estado!=='suspendido')patch.corteMora=null;
      if(full&&$('#cf-extras',el))patch.extras=$$('[data-extra]',el).filter(i=>i.checked).map(i=>i.dataset.extra);
      if(old&&full&&billChanged()){
        const fix=$('#cf-vig-fix',el).checked,eff=$('#cf-vig-mes',el).value,min=cfVigMin(old);
        if(!fix){
          if(!/^\d{4}-\d{2}$/.test(eff)||eff>curMonth())return toast('Elegí desde qué mes rigen los cambios (este mes o uno anterior)','bad');
          if(min&&eff<min)return toast('Desde '+monthLabel(min)+' como mínimo: antes de eso ya figuran cambios anteriores','bad');
          if(!min||eff>min){   /* lo anterior queda como estaba hasta el mes previo */
            const h=addMonths(eff,-1),hp=(Array.isArray(old.hp)?old.hp:[]).filter(e=>e.h<h);
            hp.push({h,planId:old.planId||null,precio:hasNum(old.precio)?Number(old.precio):null,extras:Array.isArray(old.extras)?old.extras:[]});
            patch.hp=hp;
          }
        }
      }
      try{
        if(old)await saveClient(old,patch);
        else{const nid=newId();await putItem('clientes',clientShard(nid),nid,Object.assign({creado:Date.now(),mod:Date.now()},patch));}
        toast('Cliente guardado');closeModal();
      }catch(err){dbError(err);}
    });
  }});
}

/* ----- vista ----- */
VIEWS.clientes={
  mount(el){
    el.innerHTML=`<div class="toolbar"><div class="line"><input class="search" id="cl-q" type="search" placeholder="Buscar por nombre, N° de cliente, DNI, teléfono, calle o usuario" autocomplete="off" aria-label="Buscar clientes" value="${esc(CL.q)}">
      ${can('editarClientes')?'<button class="btn primary" type="button" id="cl-new">Nuevo cliente</button>':''}</div>
      <div class="seg" id="cl-seg"></div></div><div id="cl-count" class="hint"></div><div class="list" id="cl-list"></div>`;
    $('#cl-q',el).addEventListener('input',e=>{CL.q=e.target.value;CL.limit=50;this.update();});
    const nb=$('#cl-new',el);if(nb)nb.addEventListener('click',()=>openClientForm(null));
    $('#cl-seg',el).addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;CL.estado=b.dataset.f;CL.limit=50;this.update();});
    $('#cl-list',el).addEventListener('click',e=>{
      const b=e.target.closest('[data-open-client]');if(b)return openClient(b.dataset.openClient);
      if(e.target.closest('[data-more]')){CL.limit+=50;this.update();}
    });
    this.update();
  },
  update(){
    const seg=$('#cl-seg');if(!seg)return;
    const fs=[['todos','Todos'],['activo','Activos'],['suspendido','Suspendidos'],['pendiente','Por instalar'],['nogeo','Sin ubicación']];
    if(can('red'))fs.push(['nonap','Sin caja NAP']);
    if(can('caja')||can('cobrar'))fs.splice(4,0,['deuda','Con deuda'],['c1','Ciclo 1'],['c2','Ciclo 2']);
    serviciosList().filter(s=>s.activo!==false).forEach(s=>fs.push(['sv:'+s.id,s.nombre]));
    seg.innerHTML=fs.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${CL.estado===k}">${l}</button>`).join('');
    const filt=c=>{
      if(CL.estado==='todos')return c.estado!=='baja';
      if(CL.estado==='nogeo')return c.estado!=='baja'&&!hasGeo(c);
      if(CL.estado==='nonap')return c.estado!=='baja'&&c.estado!=='pendiente'&&!(c.nap&&S.red.has(c.nap));
      if(CL.estado==='deuda')return billing(c).vencidos>0;
      if(CL.estado.startsWith('sv:'))return c.estado!=='baja'&&Array.isArray(c.extras)&&c.extras.includes(CL.estado.slice(3));
      if(CL.estado==='c1'||CL.estado==='c2')return c.estado!=='baja'&&cicloOf(c)===Number(CL.estado[1]);
      return c.estado===CL.estado;
    };
    const rows=searchClients(CL.q,filt);
    $('#cl-count').textContent=S.loaded.clientes?`${rows.length} ${rows.length===1?'cliente':'clientes'}`:'Cargando…';
    const list=$('#cl-list');
    if(!rows.length){
      list.innerHTML=!can('clientesTodos')&&!CL.q?'<div class="empty"><b>No tenés clientes asignados</b><span>Acá aparecen los clientes de tus órdenes abiertas.</span></div>':S.clientes.size?'<div class="empty"><b>Ningún cliente coincide</b><span>Probá con otra búsqueda o cambiá el filtro.</span></div>':`<div class="empty"><b>Todavía no hay clientes</b><span>${can('editarClientes')?'Cargá el primero o importá tu lista desde un archivo CSV en Ajustes.':'La oficina todavía no cargó clientes.'}</span></div>`;
      return;
    }
    list.innerHTML=rows.slice(0,CL.limit).map(clientRow).join('')+(rows.length>CL.limit?`<button class="btn more" type="button" data-more>Ver más (${rows.length-CL.limit})</button>`:'');
  }
};

/* ===== red: cajas NAP y botellas de empalme ===== */
const RED={q:'',tipo:'todos',sort:'nombre',me:null,limit:60};
const RED_TIPO={nap:'Caja NAP',empalme:'Botella de empalme'};
const redName=id=>{const p=id&&S.red.get(id);return p?p.nombre:'';};
const redCmp=(a,b)=>norm(a.nombre).localeCompare(norm(b.nombre),'es',{numeric:true});
/* distancia en metros entre dos puntos con lat/lng (fórmula del haversine) */
function distM(a,b){
  const R=6371000,r=x=>parseFloat(x)*Math.PI/180;
  const dLat=r(b.lat)-r(a.lat),dLng=r(b.lng)-r(a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
const fmtDist=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km';
/* clientes que hoy cuelgan de una caja (los dados de baja ya no ocupan puerto) */
const napClients=id=>[...S.clientes.values()].filter(c=>c.nap===id&&c.estado!=='baja');
const napUsed=id=>napClients(id).length;
const redKids=id=>[...S.red.values()].filter(p=>p.padre===id);
function redDescendants(id){
  const out=new Set(),todo=[id];
  while(todo.length){const x=todo.pop();for(const k of redKids(x))if(!out.has(k.id)){out.add(k.id);todo.push(k.id);}}
  return out;
}
function napLine(c){
  if(!c||!c.nap)return '';
  const p=S.red.get(c.nap);if(!p)return '';
  return `<b>${esc(p.nombre)}</b>${c.napPuerto?' · puerto '+esc(c.napPuerto):''} <button class="btn small ghost" type="button" data-act="nap">Ver caja</button>`;
}

/* ----- campo «Caja NAP» + puerto del cliente (formulario y cierre de instalación) ----- */
function napOptionsHTML(sel,from){
  const l=[...S.red.values()].filter(p=>p.tipo==='nap').map(p=>({p,d:from&&hasGeo(p)?distM(from,p):null}));
  l.sort((a,b)=>(a.d!=null&&b.d!=null)?a.d-b.d:(a.d!=null?-1:(b.d!=null?1:redCmp(a.p,b.p))));
  return '<option value="">Sin caja asignada</option>'+l.map(({p,d})=>{
    const u=napUsed(p.id);
    return opt(p.id,p.nombre+' · '+(p.puertos?u+'/'+p.puertos+' puertos':u+(u===1?' cliente':' clientes'))+(d!=null?' · a '+fmtDist(d):''),p.id===sel);
  }).join('');
}
function napFieldHTML(c){
  const from=hasGeo(c)?c:null,none=![...S.red.values()].some(p=>p.tipo==='nap');
  return `<div class="grid2">${F('Caja NAP de la que sale','cf-nap',`<select id="cf-nap">${napOptionsHTML(c&&c.nap,from)}</select>`,none?'Todavía no hay cajas NAP cargadas: se cargan en la pestaña «Red».':'Con la ubicación cargada, las más cercanas aparecen primero.')}
    ${F('Puerto','cf-nap-puerto',`<input id="cf-nap-puerto" type="number" min="1" max="288" step="1" inputmode="numeric" value="${c&&c.napPuerto?esc(c.napPuerto):''}">`)}</div>
    <div class="hint" id="cf-nap-hint"></div>`;
}
/* devuelve una función que lee el campo: null si no está en pantalla, {nap,puerto} o {bad:'texto'} */
function bindNapField(root,selfId){
  const sel=$('#cf-nap',root),pu=$('#cf-nap-puerto',root),hint=$('#cf-nap-hint',root),geo=$('#cf-geo',root);
  if(!sel)return ()=>null;
  const sort=()=>{   /* si cambian las coordenadas (por ejemplo con el GPS), las cajas más cercanas pasan arriba */
    const g=geo&&parseCoords(geo.value),cur=sel.value;
    if(!g)return;
    sel.innerHTML=napOptionsHTML(cur,g);sel.value=cur;
  };
  const check=()=>{
    const id=sel.value,n=parseInt(pu.value,10),p=id&&S.red.get(id);
    hint.className='hint';hint.textContent='';
    if(pu.value&&!id){hint.className='hint bad';hint.textContent='Elegí la caja a la que corresponde ese puerto.';return;}
    if(!p)return;
    if(pu.value&&!(n>=1)){hint.className='hint bad';hint.textContent='El puerto tiene que ser un número.';return;}
    if(p.puertos&&n>p.puertos){hint.className='hint bad';hint.textContent=p.nombre+' tiene '+p.puertos+' puertos: el '+n+' no existe.';return;}
    const other=pu.value?napClients(id).find(c=>c.id!==selfId&&parseInt(c.napPuerto,10)===n):null;
    if(other){hint.className='hint bad';hint.textContent='El puerto '+n+' de '+p.nombre+' ya figura usado'+(clientVisible(other)?' por '+other.nombre:' por otro cliente')+'. Revisalo.';return;}
    const used=napClients(id).filter(c=>c.id!==selfId).map(c=>parseInt(c.napPuerto,10)).filter(x=>x>=1);
    if(p.puertos){
      const free=[];for(let i=1;i<=p.puertos&&free.length<12;i++)if(!used.includes(i))free.push(i);
      hint.textContent=free.length?'Puertos sin usar: '+free.join(', ')+(free.length===12?'…':'')+'.':(napUsed(id)-(napClients(id).some(c=>c.id===selfId)?1:0)>=p.puertos?'Esta caja está llena.':'');
    }
  };
  sel.addEventListener('change',check);pu.addEventListener('input',check);
  if(geo)geo.addEventListener('input',sort);
  check();
  return ()=>{
    const id=sel.value||null,raw=pu.value.trim(),n=raw===''?null:parseInt(raw,10);
    if(raw!==''&&!(n>=1))return {bad:'El puerto tiene que ser un número.'};
    if(raw!==''&&!id)return {bad:'Elegí la caja NAP de ese puerto.'};
    return {nap:id,puerto:id?n:null};
  };
}

/* ----- lista ----- */
function redRow(p,d){
  const nap=p.tipo==='nap',u=nap?napUsed(p.id):0,kids=redKids(p.id).length,par=p.padre?redName(p.padre):'';
  const use=nap?(p.puertos?`<span class="chip ${u>=p.puertos?'bad':'ok'}">${u}/${p.puertos} puertos</span>`:`<span class="chip">${u} ${u===1?'cliente':'clientes'}</span>`):(kids?`<span class="chip info">Alimenta ${kids}</span>`:'');
  return `<button class="item" type="button" data-open-red="${esc(p.id)}">
    <div><div class="t">${esc(p.nombre)} <span class="chip ${nap?'accent':'info'}">${esc(RED_TIPO[p.tipo]||p.tipo)}</span></div>
    <div class="s">${esc([p.ref,par?'Sale de '+par:''].filter(Boolean).join(' · ')||'Sin referencia')}</div></div>
    <div class="side">${use}</div>
    <div class="tags">${hasGeo(p)?'':'<span class="chip warn">Sin ubicación</span>'}${d!=null?`<span class="chip info">a ${esc(fmtDist(d))}</span>`:''}</div></button>`;
}
function redRows(){
  const parts=norm(RED.q).trim().split(/\s+/).filter(Boolean);
  let l=[...S.red.values()].filter(p=>{
    if(RED.tipo==='nap'&&p.tipo!=='nap')return false;
    if(RED.tipo==='empalme'&&p.tipo!=='empalme')return false;
    if(RED.tipo==='nogeo'&&hasGeo(p))return false;
    if(RED.tipo==='llenas'&&!(p.tipo==='nap'&&p.puertos&&napUsed(p.id)>=p.puertos))return false;
    if(parts.length){const h=norm([p.nombre,p.ref,p.notas,RED_TIPO[p.tipo],redName(p.padre)].join(' '));if(!parts.every(x=>h.includes(x)))return false;}
    return true;
  }).map(p=>({p,d:RED.sort==='cerca'&&RED.me&&hasGeo(p)?distM(RED.me,p):null}));
  if(RED.sort==='cerca'&&RED.me)l.sort((a,b)=>(a.d!=null&&b.d!=null)?a.d-b.d:(a.d!=null?-1:(b.d!=null?1:redCmp(a.p,b.p))));
  else l.sort((a,b)=>redCmp(a.p,b.p));
  return l;
}
let redRun=null;
function exportRed(){
  const rows=[['tipo','nombre','latitud','longitud','puertos','clientes conectados','sale de','referencia','notas']];
  [...S.red.values()].sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==='nap'?-1:1)||redCmp(a,b)).forEach(p=>{
    rows.push([RED_TIPO[p.tipo]||p.tipo,p.nombre,hasGeo(p)?p.lat:'',hasGeo(p)?p.lng:'',p.puertos||'',p.tipo==='nap'?napUsed(p.id):'',redName(p.padre),p.ref||'',p.notas||'']);
  });
  saveFile('red-'+todayStr()+'.csv',toCsv(rows));
}

/* ===== planes ===== */
const TEC_PLAN={fibra:'Fibra óptica',wireless:'Antena wireless',ambas:'Fibra y wireless'};
const mbpsStr=v=>{v=Number(v)||0;return Number.isInteger(v)?v+'M':Math.round(v*1000)+'k';};
/* "25", "25M", "256k", "1,5M" → "25M" · "256k" · "1.5M" (un número solo se toma como M). null si no se entiende, '' si está vacío */
function rateNorm(v){
  const t=String(v==null?'':v).trim().replace(',','.');if(!t)return '';
  const m=t.match(/^(\d+(?:\.\d+)?)\s*([kKmMgG])?$/);if(!m)return null;
  return m[1]+(m[2]?(m[2].toLowerCase()==='k'?'k':m[2].toUpperCase()):'M');
}
/* parámetros de la Simple Queue de MikroTik: [clave, título, nombre en MikroTik, tipo, ejemplo] */
const Q_FIELDS=[
  ['burst','Ráfaga máxima','burst-limit','rate','25M'],
  ['thr','Umbral de ráfaga','burst-threshold','rate','8M'],
  ['time','Tiempo de ráfaga (segundos)','burst-time','int','22'],
  ['limit','Velocidad garantizada','limit-at','rate','256k'],
  ['prio','Prioridad (1 a 8)','priority','prio','8'],
  ['bucket','Tamaño de bucket','bucket-size','ratio','0.1'],
  ['type','Tipo de cola','queue','text','default-small']
];
/* argumentos en el orden de MikroTik: subida/bajada */
function queueArgs(p){
  const q=p.q||{},out=['max-limit='+mbpsStr(p.subida)+'/'+mbpsStr(p.bajada)];
  const has=x=>x!=null&&x!=='';
  const add=(name,k,suf)=>{
    let s=q[k+'S'],b=q[k+'B'];if(!has(s))s=b;if(!has(b))b=s;if(!has(s))return;
    out.push(name+'='+s+(suf||'')+'/'+b+(suf||''));
  };
  Q_FIELDS.forEach(([k,,name])=>add(name,k,k==='time'?'s':''));
  if(q.parent)out.push('parent='+(/\s/.test(q.parent)?'"'+q.parent+'"':q.parent));
  return out;
}
const queueText=p=>queueArgs(p).join(' ');
/* comando completo para un cliente (necesita su IP y su plan) */
function clientQueueCmd(c){
  const p=S.planes.get(c.planId),ip=String(c.ip||'').trim();
  if(!p||!ip)return null;
  return '/queue simple add name="'+String(c.nombre||'').replace(/["\\$]/g,'')+'" target='+ip+' '+queueText(p);
}
function planClientCount(id){let n=0;for(const c of S.clientes.values())if(c.planId===id&&c.estado==='activo')n++;return n;}
/* ----- precios con vigencia: aviso del cambio programado y bloque «rige desde» de los formularios ----- */
function nextChangeHTML(item){
  const cur=curMonth(),e=Array.isArray(item.hist)?item.hist.find(x=>x.d>cur):null;
  return e?`<div class="small"><span class="chip info">Desde ${esc(monthLabel(e.d))}: ${esc(fmtMoney(e.p))}</span></div>`:'';
}
function vigHTML(pre,item){
  const cur=curMonth(),noHist=!(Array.isArray(item&&item.hist)&&item.hist.length);
  return `<div class="notice info" id="${pre}-vig" hidden>
    <div class="field"><label for="${pre}-vig-mes">El precio nuevo rige desde</label><input id="${pre}-vig-mes" type="month" min="${cur}" value="${addMonths(cur,1)}"></div>
    <div class="hint">Los meses anteriores conservan el precio que tenían: a quien ya pagó no le aparece deuda. Se puede dejar el mes siguiente o elegir otro.</div>
    ${noHist?`<label class="per"><input id="${pre}-vig-fix" type="checkbox"><span class="grow">Es un error de carga (por ejemplo $17 en vez de $17.000): corregir el precio de todos los meses</span></label>`:''}</div>`;
}
/* arma {precio,hist} para guardar; null si falta o no es válido el mes. */
function readVig(pre,el,item,precio){
  if(!item)return {precio};
  if(precio===planNow(item))return {precio:item.precio,hist:item.hist};
  const fix=$('#'+pre+'-vig-fix',el);
  if(fix&&fix.checked)return {precio};
  const eff=$('#'+pre+'-vig-mes',el).value;
  if(!/^\d{4}-\d{2}$/.test(eff)||eff<curMonth()){toast('Elegí desde qué mes rige el precio nuevo (este mes o uno futuro)','bad');return null;}
  return {precio,hist:histWith(item,eff,precio)};
}
function bindVig(pre,el,item,get){
  const box=$('#'+pre+'-vig',el);if(!box||!item)return;
  const f=()=>{const n=get();box.hidden=!(n!==null&&n>=0&&n!==planNow(item));};
  const inp=$('#'+pre+'-precio',el);inp.addEventListener('input',f);f();
}

    ${isAdmin()?`<div class="actions start"><button class="btn small" type="button" data-edit-plan="${esc(p.id)}">Editar</button></div>`:''}</article>`;

function qRowHTML([k,label,key,kind,ex],q){
  const val=s=>esc(q[k+s]==null?'':q[k+s]);
  return F(`${label} <span class="muted small mono">${key}</span>`,`q-${k}B`,`<div class="qpair"><input id="q-${k}B" autocomplete="off" inputmode="${kind==='rate'||kind==='text'?'text':'decimal'}" placeholder="${esc(ex)}" aria-label="${esc(label)}, bajada" value="${val('B')}"><input id="q-${k}S" autocomplete="off" inputmode="${kind==='rate'||kind==='text'?'text':'decimal'}" placeholder="${esc(ex)}" aria-label="${esc(label)}, subida" value="${val('S')}"></div>`);
}
function openPlanForm(id){
  const old=id?S.planes.get(id):null;const p=old||{activo:true,tecnologia:'fibra'};
  const q=p.q||{},hasQ=Object.keys(q).length>0;
  const html=`<form class="form" id="pform" novalidate>
    ${F('Nombre del plan *','pf-nombre',`<input id="pf-nombre" value="${esc(p.nombre||'')}" placeholder="Hogar 100" autocomplete="off">`)}
    <div class="grid2">${F('Bajada (Mbps) *','pf-bajada','<input id="pf-bajada" type="text" inputmode="decimal" autocomplete="off" value="'+esc(p.bajada||'')+'">')}${F('Subida (Mbps) *','pf-subida','<input id="pf-subida" type="text" inputmode="decimal" autocomplete="off" value="'+esc(p.subida||'')+'">')}</div>
    <div class="grid2">${F('Precio mensual (ARS) *','pf-precio',`<input id="pf-precio" type="text" inputmode="decimal" autocomplete="off" placeholder="17000" value="${p.precio==null?'':esc(old?planNow(old):p.precio)}">`,'<span id="pf-precio-h"></span>')}${F('Tecnología','pf-tec',`<select id="pf-tec">${Object.entries(TEC_PLAN).map(([k,v])=>opt(k,v,k===p.tecnologia)).join('')}</select>`)}</div>
    ${old?vigHTML('pf',old):''}
    <details class="qsec"${hasQ?' open':''}><summary>Ráfaga y parámetros de la cola (MikroTik)</summary>
      <div class="form" style="margin-top:10px">
      <div class="hint">Completá solo lo que usás, igual que en la Simple Queue. Escribí como en MikroTik: <span class="mono">25M</span>, <span class="mono">256k</span>. Un número solo se toma como M. Si cargás un solo lado, el otro copia el mismo valor.</div>
      <div class="qpair qhead"><b>Bajada (download)</b><b>Subida (upload)</b></div>
      ${Q_FIELDS.map(f=>qRowHTML(f,q)).join('')}
      ${F('Parent (opcional)','q-parent',`<input id="q-parent" autocomplete="off" placeholder="none" value="${esc(q.parent||'')}">`)}
      <div class="hint">Así queda: <span class="mono" id="q-prev"></span></div></div></details>
    ${F('Nombre del perfil en el router (opcional)','pf-perfil',`<input id="pf-perfil" class="mono" value="${esc(p.perfil||'')}" placeholder="plan-100M">`,'Sirve de referencia para quien configura MikroTik.')}
    <label class="per"><input id="pf-activo" type="checkbox"${p.activo!==false?' checked':''}><span class="grow">Plan disponible para clientes nuevos</span></label>
    <div class="actions"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar plan</button></div></form>`;
  openModal({title:old?'Editar plan':'Nuevo plan',html,onMount(el){
    bindMoney($('#pf-precio',el),$('#pf-precio-h',el));
    const v=i=>$('#'+i,el).value.trim();
    bindVig('pf',el,old,()=>num(v('pf-precio')));
    /* lee y valida los parámetros de la cola; devuelve {q} o {error} */
    const readQ=()=>{
      const q2={};
      for(const [k,label,,kind] of Q_FIELDS)for(const side of ['B','S']){
        const raw=v('q-'+k+side);if(raw==='')continue;
        let val=null;
        if(kind==='rate'){val=rateNorm(raw);}
        else if(kind==='int'){val=/^\d+$/.test(raw)?raw:null;}
        else if(kind==='prio'){val=/^[1-8]$/.test(raw)?raw:null;}
        else if(kind==='ratio'){const n=parseFloat(raw.replace(',','.'));val=/^\d+([.,]\d+)?$/.test(raw)&&n>0?String(n):null;}
        else val=/^[\w.\-]+$/.test(raw)?raw:null;
        if(val===null)return {error:`${label}: «${raw}» no es un valor válido`};
        q2[k+side]=val;
      }
      const par=v('q-parent');
      if(par&&par!=='none'){if(/["\\]/.test(par))return {error:'Parent: no uses comillas'};q2.parent=par;}
      return {q:q2};
    };
    const prev=()=>{
      const r=readQ(),b=num(v('pf-bajada')),s=num(v('pf-subida')),el2=$('#q-prev',el);
      el2.textContent=r.error?r.error:(b&&s?queueText({bajada:b,subida:s,q:r.q}):'Completá bajada y subida.');
    };

    $('#pform',el).addEventListener('submit',async e=>{

      if(!bajada||!subida)return toast('Completá bajada y subida','bad');
      if(precio===null||precio<0)return toast('Completá el precio','bad');
      const r=readQ();if(r.error)return toast(r.error,'bad');
      const vg=readVig('pf',el,old,precio);if(!vg)return;
      const obj={nombre:v('pf-nombre'),bajada,subida,precio:vg.precio,tecnologia:v('pf-tec'),perfil:v('pf-perfil'),q:Object.keys(r.q).length?r.q:null,activo:$('#pf-activo',el).checked,mod:Date.now()};
      if(vg.hist)obj.hist=vg.hist;
      try{await S.db.collection('planes').doc(old?old.id:newId()).set(obj);toast('Plan guardado');closeModal();}catch(err){dbError(err);}
    });
  }});
}

function restoreFromFile(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('No se pudo leer el archivo','bad');
  rd.onload=async()=>{
    let obj;try{obj=JSON.parse(String(rd.result));}catch(e){return toast('El archivo no es una copia válida','bad');}
    if(!obj||!Array.isArray(obj.docs))return toast('El archivo no es una copia válida','bad');
    const nCli=obj.docs.filter(d=>d.coll==='clientes').reduce((n,d)=>n+Object.keys((d.data&&d.data.items)||{}).length,0);
    if(!await askConfirm(`Esta copia trae ${nCli} clientes. Restaurarla REEMPLAZA todos los datos actuales (se guarda una copia de seguridad antes). Se cierran todas las sesiones y los usuarios tienen que entrar de nuevo. ¿Seguimos?`,'Restaurar',true))return;
    try{
      showRestored(await NET.api('POST','/api/restore',obj,{timeout:300000,noKick:true}));
    }catch(err){toast(err.message||'No se pudo restaurar','bad');}
  };
  rd.readAsText(file);
}

function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const delim=first.split(';').length>first.split(',').length?';':(first.includes('\t')?'\t':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[];}
    else cell+=ch;
  }
  row.push(cell);if(row.some(c=>c.trim()!==''))rows.push(row);
  return rows;
}
