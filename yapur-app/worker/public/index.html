/* ===== pagar deuda =====
   Se escribe cuánto paga el cliente y, si hace falta, se reparte entre varios medios (15.000 en efectivo + 4.000 por transferencia): un solo recibo.
   Lo que paga se aplica a lo más viejo primero: la deuda anterior y después los meses hasta el actual. */
function deudaDe(c){
  const cur=todayStr().slice(0,7),grp=cuentaMiembros(c),gm=grp.length>1,head=gm?grp[0]:c,ord=new Map(grp.map((m,i)=>[m.id,i])),meses=[];
  (gm?grp:[c]).forEach(m=>{const b=billing(m,true);if(b.aplica)b.periods.forEach(q=>{if(q.per<=cur&&q.rest>0)meses.push({cid:m.id,per:q.per,rest:q.rest,nombre:m.nombre,venc:!!q.venc,due:q.due});});});
  meses.sort((a,b)=>a.per.localeCompare(b.per)||((ord.get(a.cid)||0)-(ord.get(b.cid)||0)));
  const da=deudaAntRest(c),r2=v=>Math.round(v*100)/100;
  /* deuda = deuda anterior + meses ya vencidos. El mes en curso que todavía no vence («Mes a vencer») no es deuda: se puede sumar al pago, pero no se pide */
  return {gm,head,meses,da,total:r2(da+meses.filter(x=>x.venc).reduce((t,x)=>t+x.rest,0)),max:r2(da+meses.reduce((t,x)=>t+x.rest,0))};
}
const tieneDeuda=c=>{try{return !!c&&deudaDe(c).total>0;}catch(e){return false;}};

function repartirDeuda(d,medios){
  const cola=[];
  if(d.da>0)cola.push({k:'da',left:Math.round(d.da*100)});
  d.meses.forEach(x=>cola.push({k:'mes',cid:x.cid,per:x.per,nombre:x.nombre,left:Math.round(x.rest*100)}));
  const out=[];let i=0;
  for(const m of medios){
    let a=Math.round(m.monto*100);
    while(a>0&&i<cola.length){
      const q=cola[i],t=Math.min(a,q.left);
      out.push({k:q.k,cid:q.cid,per:q.per,nombre:q.nombre,metodo:m.metodo,monto:t/100});
      a-=t;q.left-=t;if(q.left<=0)i++;

  }

}

/* ===== foto del comprobante de una transferencia =====

   La foto se reduce en el celular (lado mayor 1400 px, JPEG de menos de 400 KB) y se sube apenas se elige; el cobro lleva solo su número. */
const COMP_METODOS=['transferencia'];
const pideComp=metodo=>soloCampo()&&COMP_METODOS.includes(metodo);
function fotoJpeg(file){
  return new Promise((ok,mal)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));

        if(d.length*0.75>440e3)mal(new Error('La foto es demasiado grande. Sacala de nuevo más cerca del comprobante.'));else ok(d);
      }catch(e){URL.revokeObjectURL(url);mal(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);mal(new Error('No se pudo leer la foto. Sacala de nuevo o elegí otra imagen (JPG o PNG).'));};
    img.src=url;
  });

/* ===== cortes y reconexiones ===== */
function cortesData(){
  const cortar=[],reconectar=[],promesas=[];
  const vis=can('clientesTodos')?null:visibleSet();
  for(const c of S.clientes.values()){
    if(c.estado!=='activo'&&c.estado!=='suspendido')continue;
    if(vis&&!vis.has(c.id))continue;
    const s=cutState(c);
    if(c.estado==='activo'&&s.k==='cortar')cortar.push({c,s});
    else if(aReconectar(c))reconectar.push({c,s});
    if(s.k==='promesa')promesas.push({c,s});
  }
  const byName=(a,b)=>norm(a.c.nombre).localeCompare(norm(b.c.nombre));
  cortar.sort((a,b)=>a.s.desde.localeCompare(b.s.desde)||byName(a,b));
  reconectar.sort(byName);
  promesas.sort((a,b)=>a.s.hasta.localeCompare(b.s.hasta)||byName(a,b));
  return {cortar,reconectar,promesas};
}
async function setSuspension(clients,on){
  if(!can('editarClientes'))return toast('Tu perfil no puede cambiar el estado de los clientes','bad');
  const by={},now=Date.now(),today=todayStr();
  clients.forEach(c=>{
    const o=Object.assign(stripInternal(c),on?{estado:'suspendido',corteMora:today}:{estado:'activo',corteMora:null,reconectado:today},{mod:now});
    (by[clientShard(c.id)]=by[clientShard(c.id)]||{})[c.id]=o;
  });
  try{for(const sh of Object.keys(by))await putMany('clientes',sh,by[sh]);toast(on?`${clients.length} marcados como suspendidos`:`${clients.length} reconectados`);}
  catch(err){dbError(err);}
}
/* script de MikroTik para clientes con usuario PPPoE cargado */
function mikrotikScript(list,enable){
  const withU=list.filter(c=>c.usuario&&String(c.usuario).trim());
  const q=u=>String(u).trim().replace(/["\\$\r\n]/g,'');
  const lines=[`# ${enable?'Reconexiones':'Cortes'} ${S.ajustes.empresa} - ${dmy(todayStr())} - revisalo antes de pegarlo`];
  withU.forEach(c=>lines.push(`/ppp secret ${enable?'enable':'disable'} [find name="${q(c.usuario)}"]`));
  if(!enable)withU.forEach(c=>lines.push(`/ppp active remove [find name="${q(c.usuario)}"]`));
  return {text:lines.join('\n'),n:withU.length,sin:list.length-withU.length};
}
function copyScript(list,enable){
  const r=mikrotikScript(list,enable);
  if(!r.n)return toast('Ninguno tiene usuario cargado','bad');
  copyText(r.text,'Script');
  if(r.sin)setTimeout(()=>toast(`${r.sin} sin usuario quedaron afuera`,'bad'),900);
}
function copyUsers(list){
  const u=list.map(c=>String(c.usuario||'').trim()).filter(Boolean);
  if(!u.length)return toast('Ninguno tiene usuario cargado','bad');
  copyText(u.join('\n'),'Usuarios');
}

  if(kind==='script-off')return copyScript(cs,false);

    (j.docs||[]).forEach(d=>{const it=(d.data||{}).items||{};for(const k in it)S.pagos.set(k,Object.assign({},it[k],{id:k,_doc:d.id}));});

/* Factura electrónica de ARCA. Los recibos siguen igual: la factura es un paso aparte que se pide desde el recibo, solo cuando hace falta.
   Ajustes (administrador): pedido de certificado, punto de venta y prueba de conexión. Recibo: «Emitir factura ARCA», ver / imprimir / enviar y nota de crédito. */
const FE_LETRA={1:'A',6:'B',3:'A',8:'B'},FE_COD={1:'001',6:'006',3:'003',8:'008'},FE_NOMBRE={1:'FACTURA',6:'FACTURA',3:'NOTA DE CRÉDITO',8:'NOTA DE CRÉDITO'};
const FE_COND={1:'Responsable Inscripto',4:'IVA Sujeto Exento',5:'Consumidor Final',6:'Responsable Monotributo',7:'Sujeto No Categorizado'};
const feNro=f=>String(f.pv).padStart(5,'0')+'-'+String(f.nro).padStart(8,'0');
const feVto=v=>/^\d{8}$/.test(v||'')?v.slice(6)+'/'+v.slice(4,6)+'/'+v.slice(0,4):v||'';
const feFecha=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?dmy(v):v||'';
const fePesos=n=>fmtMoney(Number(n)||0);

/* ----- Ajustes ----- */
function arcaAjustesCard(){
  return `<div class="card" id="arca-card"><h2>Factura electrónica ARCA</h2>
    <p class="muted small">Los recibos siguen como siempre. Si un cliente necesita factura, se pide desde su recibo con «Emitir factura ARCA». Sale a nombre de la razón social de Ajustes → Recibo, como Responsable Inscripto.</p>
    <div id="arca-st" class="hint">Mirando el estado…</div></div>`;
}
async function arcaAjustesMount(el){
  const root=$('#arca-st',el);if(!root)return;
  let a;try{a=await NET.api('GET','/api/arca');}catch(err){root.textContent=err.network?'No se pudo conectar con el servidor.':err.message;return;}
  const em=a.emisor||{};
  const falta=!em.cuit||em.cuit.length!==11;
  root.className='';
  root.innerHTML=`
    <div class="kv-lite"><div><b>Emisor:</b> ${esc(em.razon||'sin razón social')} · CUIT ${esc(em.cuit||'sin cargar')}</div>
    ${falta?'<div class="notice warn" style="margin-top:8px">Falta el CUIT. Cargalo en Ajustes → Recibo (son 11 números) y volvé acá.</div>':''}
    ${a.mock?'<div class="notice info" style="margin-top:8px">Este servidor está conectado a un ARCA de prueba simulado.</div>':''}</div>
    <h3 style="margin-top:14px">1. Certificado</h3>
    <div class="hint">${a.tieneCert?`Certificado cargado, vence el ${esc(dmy(a.certHasta||''))}. Faltando un mes conviene pedir otro.`:a.tieneClave?'Pedido de certificado listo: llevalo a ARCA (pasos abajo) y pegá acá el certificado que te devuelven.':'Todavía no hay certificado.'}</div>
    <div class="actions start"><button class="btn${a.tieneClave?'':' primary'}" type="button" id="arca-gen" ${falta?'disabled':''}>${a.tieneClave?'Generar un pedido nuevo':'Generar el pedido de certificado'}</button></div>
    <div id="arca-csr" ${a.tieneClave&&!a.tieneCert&&a.csr?'':'hidden'}>
      <div class="field"><label for="arca-csr-t">Pedido de certificado (CSR)</label><textarea id="arca-csr-t" rows="5" readonly class="mono small">${esc(a.csr||'')}</textarea></div>
      <div class="actions start"><button class="btn small" type="button" id="arca-csr-c">Copiar</button><button class="btn small" type="button" id="arca-csr-d">Descargar archivo .csr</button></div>
      <ol class="small" style="margin:10px 0 0 18px;line-height:1.5">
        <li>Entrá a ARCA con tu CUIT y tu clave fiscal, como siempre (esto lo hacés vos).</li>
        <li>Abrí el servicio <b>«Administración de Certificados Digitales»</b> (en el ambiente de pruebas se llama «WSASS – Autoservicio de Acceso a WSHomologación»). Agregá un alias, pegá el pedido de arriba y descargá el certificado (.crt).</li>
        <li>En <b>«Administrador de Relaciones de Clave Fiscal»</b> autorizá ese alias para el servicio <b>«Facturación Electrónica» (wsfe)</b>.</li>
        <li>En <b>«Administración de puntos de venta y domicilios»</b> creá un punto de venta del tipo <b>«RECE para aplicativo y web services»</b> y anotá su número.</li>
        <li>Abrí el certificado con el Bloc de notas, copiá todo el texto y pegalo acá abajo.</li></ol></div>
    <div id="arca-cert-box" ${a.tieneClave?'':'hidden'}>
      <div class="field"><label for="arca-cert">Certificado que devolvió ARCA</label><textarea id="arca-cert" rows="5" class="mono small" placeholder="-----BEGIN CERTIFICATE-----"></textarea></div>
      <div class="actions start"><button class="btn primary" type="button" id="arca-cert-g">Guardar certificado</button></div></div>
    <h3 style="margin-top:14px">2. Punto de venta y ambiente</h3>
    <div class="grid2">${F('Punto de venta (número)','arca-pv',`<input id="arca-pv" type="number" inputmode="numeric" min="1" max="99999" value="${esc(a.pv||'')}">`)}
      ${F('Ambiente','arca-amb',`<select id="arca-amb"><option value="homo"${a.amb!=='prod'?' selected':''}>Pruebas (facturas sin validez)</option><option value="prod"${a.amb==='prod'?' selected':''}>Producción (facturas reales)</option></select>`)}</div>
    <div class="actions start"><button class="btn" type="button" id="arca-pv-g">Guardar</button><button class="btn" type="button" id="arca-probar" ${a.tieneCert?'':'disabled'}>Probar conexión con ARCA</button></div>
    <div id="arca-res" class="hint" aria-live="polite"></div>
    <div class="small muted" style="margin-top:10px">${a.listo?(a.amb==='prod'?'<b>Listo para facturar de verdad.</b>':'<b>Listo para probar.</b> Cuando todo salga bien, probá con el ambiente «Producción» (y su propio certificado y punto de venta, que se piden aparte en ARCA).'):'Todavía falta completar los pasos de arriba.'} El certificado y la clave quedan guardados solo en el servidor y no se copian al servidor de respaldo.</div>`;
  const res=$('#arca-res',el),aviso=(t,mal)=>{res.className=mal?'notice bad':'notice ok';res.textContent=t;};
  const rec=()=>arcaAjustesMount(el);
  const gen=$('#arca-gen',el);
  if(gen)gen.addEventListener('click',async()=>{
    if(a.tieneClave&&!await askConfirm('Si generás un pedido nuevo, el certificado actual deja de servir y tenés que pedir otro en ARCA. ¿Seguimos?','Generar uno nuevo'))return;
    gen.disabled=true;
    try{await NET.api('POST','/api/arca/clave',{reemplazar:!!a.tieneClave});toast('Pedido de certificado creado');rec();}
    catch(err){gen.disabled=false;toast(err.network?'No se pudo conectar con el servidor':err.message,'bad');}
  });
  const cc=$('#arca-csr-c',el);if(cc)cc.addEventListener('click',()=>copyText(a.csr,'Pedido de certificado'));
  const cd=$('#arca-csr-d',el);if(cd)cd.addEventListener('click',()=>{const u=URL.createObjectURL(new Blob([a.csr],{type:'application/x-pem-file'})),l=document.createElement('a');l.href=u;l.download='yapur-pedido.csr';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),20000);});
  const cg=$('#arca-cert-g',el);
  if(cg)cg.addEventListener('click',async()=>{
    cg.disabled=true;
    try{await NET.api('POST','/api/arca/certificado',{pem:$('#arca-cert',el).value});toast('Certificado guardado');rec();}
    catch(err){cg.disabled=false;aviso(err.network?'No se pudo conectar con el servidor.':err.message,true);}
  });
  $('#arca-pv-g',el).addEventListener('click',async()=>{
    try{await NET.api('PUT','/api/arca',{pv:$('#arca-pv',el).value?Number($('#arca-pv',el).value):null,amb:$('#arca-amb',el).value});toast('Guardado');rec();}
    catch(err){aviso(err.network?'No se pudo conectar con el servidor.':err.message,true);}
  });
  const pb=$('#arca-probar',el);
  if(pb)pb.addEventListener('click',async()=>{
    pb.disabled=true;res.className='hint';res.textContent='Conectando con ARCA…';
    try{
      const r=await NET.api('POST','/api/arca/probar',{});
      const pts=(r.puntos||[]).map(p=>p.nro+(p.bloqueado?' (bloqueado)':'')).join(', ');
      const ok=!r.pvError&&!r.puntosError;
      aviso('Conexión con ARCA ('+(r.ambiente==='prod'?'producción':'pruebas')+') correcta. '+(pts?'Puntos de venta que ARCA ve: '+pts+'. ':(r.puntosError?'No pude leer los puntos de venta: '+r.puntosError+'. ':'ARCA no informó puntos de venta. '))+(r.pvError?'Problema con el punto de venta cargado: '+r.pvError:(r.ultimaB!=null?'Última factura B: '+r.ultimaB+' · última A: '+r.ultimaA+'.':'')),!ok);
    }catch(err){aviso(err.network?'No se pudo conectar con el servidor.':err.message,true);}
    pb.disabled=false;
  });
}

/* la factura llega a la pantalla con el aviso del servidor: se espera un instante a que figure en el pago antes de abrirla */
function arcaEsperar(recibo,cond,fin){
  let n=0;const t=setInterval(()=>{
    const p=paymentsOfReceipt(recibo).find(x=>x.fe&&x.fe.cae);
    if((p&&cond(p.fe))||++n>20){clearInterval(t);fin();}
  },150);
}

function arcaPedir(recibo,ps){

    ${F('Nombre o razón social','fe-nom','<input id="fe-nom" maxlength="100" value="'+esc(cli.nombre||'')+'">')}
    ${F('DNI o CUIT del cliente','fe-doc','<input id="fe-doc" inputmode="numeric" maxlength="13" value="'+esc(dni)+'">','Si queda vacío sale a «Consumidor final». Con CUIT se puede hacer Factura A.')}
    <div id="fe-cuit" hidden>${F('Condición del cliente frente al IVA','fe-iva','<select id="fe-iva"><option value="1">Responsable Inscripto</option><option value="6">Monotributista</option><option value="4">IVA Sujeto Exento</option><option value="7">No categorizado</option></select>')}
      <div id="fe-tipo-box">${F('Tipo de factura','fe-tipo','<select id="fe-tipo"><option value="1">Factura A (IVA discriminado)</option><option value="6">Factura B</option></select>')}</div></div>

    <div class="actions"><button class="btn primary" type="button" id="fe-go">Emitir factura</button><button class="btn ghost" type="button" data-close>Cancelar</button></div>`,
    onMount(el){

      const iva=$('#fe-iva',el),tb=$('#fe-tipo-box',el),tipoSel=()=>{const ab=['1','6'].includes(iva.value);tb.hidden=!ab;if(!ab)$('#fe-tipo',el).value='6';};

        const b=ev.currentTarget,dn=doc.value.replace(/\D/g,'');

        b.disabled=true;
        try{
          const r=await NET.api('POST','/api/arca/emitir',{doc:ps[0]._doc,recibo,nombre:$('#fe-nom',el).value,docNro:dn,condIva:Number($('#fe-iva',el).value),tipo:Number($('#fe-tipo',el).value),dom:$('#fe-dom',el).value});
          toast('Factura emitida: '+FE_NOMBRE[r.fe.tipo]+' '+FE_LETRA[r.fe.tipo]+' '+feNro(r.fe));

        }catch(err){b.disabled=false;toast(err.network?'No se pudo conectar con el servidor':err.message,'bad');}
      });
    }});
}

/* ===== resumen ===== */
/* clientes: altas y bajas por mes (últimos 6), para ver si la empresa crece o se achica. «Alta» es c.alta (fecha de alta vigente,
   se actualiza en cada reactivación desde «pendiente»); «baja» es c.bajaFecha (fecha en que se dio de baja, quede o no reactivado
   después: la baja fue un hecho real de ese mes igual). */
function clientesEvol(meses){
  const altas={},bajas={};
  for(const c of S.clientes.values()){
    if(/^\d{4}-\d{2}-\d{2}$/.test(c.alta||''))altas[c.alta.slice(0,7)]=(altas[c.alta.slice(0,7)]||0)+1;
    if(/^\d{4}-\d{2}-\d{2}$/.test(c.bajaFecha||''))bajas[c.bajaFecha.slice(0,7)]=(bajas[c.bajaFecha.slice(0,7)]||0)+1;
  }
  return meses.map(m=>({m,altas:altas[m]||0,bajas:bajas[m]||0}));
}
/* órdenes cerradas por técnico en un mes: para ver la carga de trabajo repartida, no solo instalaciones (eso ya lo tiene su propia
   pantalla con el detalle). Incluye a los técnicos con 0 en el mes, para que se note quién no cerró nada. */
function ordenesPorTec(cur){
  const cnt=new Map();
  for(const o of S.ordenes.values()){
    if(o.estado!=='hecha'||!o.tecnico)continue;
    if((o.cierre||'').slice(0,7)!==cur)continue;
    cnt.set(o.tecnico,(cnt.get(o.tecnico)||0)+1);
  }
  return S.ajustes.tecnicos.map(t=>({nombre:t.nombre,n:cnt.get(t.id)||0})).sort((a,b)=>b.n-a.n||a.nombre.localeCompare(b.nombre,'es'));
}
/* «Hoy»: lo primero que ve la oficina al entrar. Qué se cobró, quién tiene trabajo abierto, qué instalaciones esperan que alguien las active y a quién hay que cortar. */
function tableroHoy(today,cd){
  const pagosHoy=[...S.pagos.values()].filter(p=>!p.anulado&&p.fecha===today);
  const cobrado=pagosHoy.reduce((s,p)=>s+(Number(p.monto)||0),0);
  const porTec=new Map();let libres=0,urg=0;
  for(const o of S.ordenes.values()){
    if(!ORD_OPEN(o))continue;
    if(o.prioridad==='urgente')urg++;
    if(!o.tecnico){libres++;continue;}
    const e=porTec.get(o.tecnico)||{n:0,u:0,nombre:(tecById(o.tecnico)||{}).nombre||o.tecNombre||'Técnico'};
    e.n++;if(o.prioridad==='urgente')e.u++;porTec.set(o.tecnico,e);
  }
  const tecs=[...porTec.values()].sort((a,b)=>b.n-a.n||a.nombre.localeCompare(b.nombre,'es'));
  const ahora=Date.now();
  const pend=[...S.clientes.values()].filter(c=>c.estado==='pendiente').map(c=>({c,dias:c.creado?Math.max(0,Math.floor((ahora-c.creado)/864e5)):0})).sort((a,b)=>b.dias-a.dias||norm(a.c.nombre).localeCompare(norm(b.c.nombre)));
  const diasTxt=d=>d<=0?'de hoy':d===1?'hace 1 día':'hace '+d+' días';
  const cortar=cd.cortar;
  return `<div class="card" id="rs-hoy"><div class="head-row"><h3>Hoy</h3><span class="small muted">${esc(today.split('-').reverse().join('/'))}</span></div>
    <div class="kpis three"><div class="kpi"><span class="n">${esc(fmtMoney(cobrado))}</span><span class="l">Cobrado hoy · ${pagosHoy.length} ${pagosHoy.length===1?'cobro':'cobros'}</span></div>
      <div class="kpi tap" data-go="ordenes" role="button" tabindex="0"><span class="n">${tecs.reduce((s,t)=>s+t.n,0)+libres}</span><span class="l">Órdenes abiertas${urg?' · '+urg+' urgentes':''}</span></div>
      <div class="kpi${cortar.length?' bad':''}${can('caja')?' tap':''}"${can('caja')?' data-go="cobranzas" data-sub="cortes" role="button" tabindex="0"':''}><span class="n">${cortar.length}</span><span class="l">Para cortar</span></div></div>
    <div class="hoy-sec"><b>Órdenes abiertas por técnico</b>${tecs.length||libres?`<div class="list">${tecs.map(t=>`<div class="per"><span class="grow">${esc(t.nombre)}</span><span class="chip">${t.n}${t.u?' · '+t.u+' urgente'+(t.u===1?'':'s'):''}</span></div>`).join('')}${libres?`<div class="per"><span class="grow muted">Sin técnico asignado</span><span class="chip bad">${libres}</span></div>`:''}</div>`:'<div class="hint">No hay órdenes abiertas.</div>'}</div>

/* ===== avisos de actualización =====
   1) App nueva en el servidor: /version.json trae el código de la versión publicada. Si no es la que está corriendo,
      aparece «Hay una versión nueva» con el botón Actualizar (recarga y listo; en el APK no hace falta reinstalar nada).
   2) APK nuevo (solo dentro del APK): el flujo que compila el APK publica yapur-version.json en el sitio de GitHub.
      Si el APK instalado es anterior, aparece «Hay un APK nuevo» con el botón Descargar. */
const BUILD='538cecde46';
const APK_INFO_URL='https://yapurnet.github.io/yapur-version.json';
const UPD={web:'',apk:null,hide:{}};
const verNum=s=>{const m=/^(\d+)\.(\d+)/.exec(String(s||'').trim());return m?Number(m[1])*100000+Number(m[2]):0;};
function drawUpdateBar(){
  /* el aviso de APK nuevo no se puede posponer («Después»): un técnico con un APK viejo no tiene el puente nativo que detecta
     la ubicación del celular apagada (ubicEstado), así que el bloqueo por ubicación no lo puede alcanzar por ese motivo hasta
     que actualice. El de la app web sí se puede posponer: esa versión ya la tiene puesta el navegador en cuanto recarga. */
  const web=UPD.web&&UPD.hide.web!==UPD.web,apk=!!UPD.apk;
  let el=document.getElementById('updBar');
  if(!web&&!apk){if(el)el.remove();return;}
  if(!el){
    el=document.createElement('div');el.id='updBar';el.className='upd';el.setAttribute('role','status');
    document.body.appendChild(el);
    el.addEventListener('click',e=>{
      const b=e.target.closest('[data-upd]');if(!b)return;
      const k=b.dataset.upd;
      if(k==='web-go')reloadForUpdate();
      else if(k==='apk-go'&&UPD.apk)NET.openExternal(UPD.apk.url);
      else if(k==='web-no'){UPD.hide.web=UPD.web;drawUpdateBar();}
    });
  }
  el.innerHTML=(web?`<div class="upd-row"><span>Hay una versión nueva de la app.</span><span class="upd-act"><button class="btn small primary" type="button" data-upd="web-go">Actualizar</button><button class="btn small ghost" type="button" data-upd="web-no" aria-label="Avisar más tarde">Después</button></span></div>`:'')
    +(apk?`<div class="upd-row"><span>Hay un APK nuevo (${esc(UPD.apk.nombre)}) con mejoras. Se baja y se instala encima, sin perder nada.</span><span class="upd-act"><button class="btn small primary" type="button" data-upd="apk-go">Descargar</button></span></div>`:'');
}
async function reloadForUpdate(){
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}catch(e){}
  location.reload();
}
let _updLast=0;
async function checkUpdates(force){
  const now=Date.now();if(!force&&now-_updLast<60000)return;_updLast=now;
  try{
    const r=await fetch('/version.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();UPD.web=(j&&typeof j.v==='string'&&/^[0-9a-f]{6,64}$/.test(j.v)&&j.v!==BUILD)?j.v:'';}
  }catch(e){}
  if(NET.native){
    try{
      const r=await fetch(APK_INFO_URL,{cache:'no-store'});
      if(r.ok){
        const j=await r.json(),have=verNum(NET.appVersion),want=verNum(j&&j.nombre);
        UPD.apk=(have>0&&want>have&&/^https:\/\/[^\s'"<>]+\.apk$/.test(String(j.apk||'')))?{nombre:String(j.nombre),url:String(j.apk)}:null;
      }
    }catch(e){}
  }
  drawUpdateBar();
}
function startUpdateWatch(){
  setTimeout(()=>checkUpdates(true),4000);
  setInterval(()=>checkUpdates(false),10*60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdates(false);});
  window.addEventListener('online',()=>checkUpdates(false));
}

/* ===== sesión y permisos ===== */
const allPerms=()=>{const o={};PERMS.forEach(([k])=>{o[k]=true;});return o;};
function deriveTecnicos(){
  S.ajustes.tecnicos=S.ajustes.perfiles.filter(p=>p.base==='tecnico'&&p.activo!==false).map(p=>({id:p.id,nombre:p.nombre,tel:p.tel||''}));
}
function permsOfPerfil(p){
  const perms=Object.assign({},PERM_DEF[p.base],p.permisos||{});
  if(p.base==='tecnico')MONEY_PERMS.forEach(k=>{perms[k]=false;});
  return perms;
}
/* los permisos reales los decide el servidor; el administrador además puede ver la app como la ve cada usuario */
function computePerms(){
  S.perfil=null;S.preview=false;S.gate=false;
  const me=S.me;
  if(S.realRole==='admin'){
    const prev=lsGet('viewAsP'),pp=prev&&S.ajustes.perfiles.find(p=>p.id===prev&&p.activo!==false);
    if(pp){S.perfil=pp;S.preview=true;S.perms=permsOfPerfil(pp);S.role=pp.base;}
    else{S.perms=allPerms();S.role='admin';}
  }else{
    S.perms=Object.assign({},me.perms);S.role=me.role;
    S.perfil=S.ajustes.perfiles.find(p=>p.id===me.id)||{id:me.id,nombre:me.nombre,base:me.role,tel:me.tel||''};
  }
  S.tecId=S.perfil&&S.perfil.base==='tecnico'?S.perfil.id:'';
  S.pv++;
}

/* ===== navegación ===== */
let tabsHtml='',renderTimer=null;
function allowedTabs(){
  const t=[];if(S.gate||S.ubicGate)return t;
  if(can('resumen'))t.push(['resumen','Resumen']);
  if(can('cobrar')||can('caja'))t.push(['cobranzas','Cobranzas']);
  const cli=['clientes',can('clientesTodos')?'Clientes':'Mis clientes'],ord=['ordenes','Órdenes'];
  if(S.role==='tecnico')t.push(ord,cli);else t.push(cli,ord);
  if(can('ordenesTodas'))t.push(['instalaciones','Instalaciones']);   /* cuántas se hicieron por día, semana y mes: lo ve quien ve las órdenes de todos */
  if(can('red'))t.push(['red','Red']);
  if(soloCampo())t.push(['miscobros','Mis cobros']);
  if(can('precios'))t.push(['planes','Planes']);
  if(can('verTecnicos'))t.push(['tecnicos','Técnicos']);
  if(isAdmin())t.push(['ajustes','Ajustes']);
  return t;
}
function renderTabs(){
  const open=[...S.ordenes.values()].filter(ORD_OPEN).length;
  const html=allowedTabs().map(([k,l])=>`<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${S.tab===k}">${l}${k==='ordenes'&&open?`<span class="count">${open}</span>`:''}${k==='tecnicos'&&TAL.sin.length?`<span class="count bad" title="Técnicos sin señal en horario">${TAL.sin.length}</span>`:''}</button>`).join('');
  if(html!==tabsHtml){tabsHtml=html;$('#tabs').innerHTML=html;}
}
function showTab(t){
  const tabs=allowedTabs();if(!tabs.length)return;
  if(!tabs.some(x=>x[0]===t))t=tabs[0][0];
  S.tab=t;lsSet('tab',t);tabsHtml='';renderTabs();
  if(typeof tecAlertaBarra==='function')tecAlertaBarra();
  const v=$('#view');v.innerHTML='';VIEWS[t].mount(v);
  window.scrollTo(0,0);
}
function updateHeader(){
  $('#brandName').textContent=S.ajustes.empresa||'YAPUR.NET';
  const chip=$('#roleChip'),btn=$('#viewAsBtn');
  chip.hidden=false;
  chip.textContent=S.preview?'Vista: '+S.perfil.nombre:(S.me?S.me.nombre:'');
  if(S.realRole==='admin'){btn.hidden=false;btn.textContent=S.preview?'Volver a mi vista':'Ver como…';}
  else btn.hidden=true;
}
function dataChanged(key){
  if(key==='pagos'||key==='clientes'||key==='planes'||key==='ajustes')rebuildDerived();
  if(key==='red')S.rv++;
  if(renderTimer)return;
  renderTimer=setTimeout(()=>{renderTimer=null;if(!S.ready||S.gate||S.ubicGate)return;updateHeader();renderTabs();const v=VIEWS[S.tab];if(v&&v.update)v.update();},60);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab);});
$('#view').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.kpi.tap[data-go]')){e.preventDefault();e.target.click();}});   /* los recuadros del Resumen que llevan a otra pestaña también se abren con el teclado */
$('#view').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){if(g.dataset.sub)CB.sub=g.dataset.sub;showTab(g.dataset.go);return;}
  const o=e.target.closest('[data-open-client]');if(o&&S.tab==='resumen')openClient(o.dataset.openClient);
});

/* ===== datos ===== */
const started={};
function startData(){
  if(!S.db)return;
  if(!started.planes){started.planes=1;
    S.db.collection('planes').onSnapshot(snap=>{
      S.planes.clear();snap.docs.forEach(d=>S.planes.set(d.id,Object.assign({},d.data(),{id:d.id})));
      delete S.errors.planes;S.loaded.planes=true;dataChanged('planes');
    },err=>{S.errors.planes=err;S.loaded.planes=true;dataChanged('planes');});}
  if(!started.clientes){started.clientes=1;watchSharded('clientes',S.clientes,'clientes');}
  if(!started.red){started.red=1;watchSharded('red',S.red,'red');}
  if(!started.ct&&can('comodato')){started.ct=1;ctStart();}
  if(!started.ordenes){started.ordenes=1;watchSharded('ordenes',S.ordenes,'ordenes');}
  if(!started.pagos){
    if(S.realRole==='admin'||can('cobrar')||can('caja')||can('promesas')||can('resumen')){started.pagos=1;watchSharded('pagos',S.pagos,'pagos');}
    else S.loaded.pagos=true;
  }
}

function refreshAll(){
  computePerms();updateHeader();startData();
  const tabs=allowedTabs(),last=S.tab||lsGet('tab');
  showTab(tabs.some(x=>x[0]===last)?last:(tabs[0]||[])[0]);
}
function onAjustesChanged(){
  const sig=()=>JSON.stringify([S.perfil&&S.perfil.id,S.perms]);
  const before=sig();
  computePerms();
  if(before!==sig()){updateHeader();startData();const tabs=allowedTabs();showTab(tabs.some(x=>x[0]===S.tab)?S.tab:(tabs[0]||[])[0]);}
  else dataChanged('ajustes');
}
/* cambió mi tipo o mis permisos en el servidor */
function onMeChanged(m){
  if(!S.ready){S.me=m;return;}
  if(m.role!==S.me.role){location.reload();return;}
  const antes=S.me.perms||{},gana=Object.keys(m.perms||{}).some(k=>m.perms[k]&&!antes[k]);   /* si le dieron un permiso, el servidor ahora le manda más datos (el plan, los precios…) */
  S.me=m;computePerms();updateHeader();startData();
  if(gana)NET.resync();
  const tabs=allowedTabs();showTab(tabs.some(x=>x[0]===S.tab)?S.tab:(tabs[0]||[])[0]);
  toast('Se actualizaron tus permisos');
}
$('#viewAsBtn').addEventListener('click',()=>{
  if(S.preview){lsSet('viewAsP','');S.tab='';lsSet('tab','');refreshAll();toast('Volviste a tu vista');return;}
  const ps=S.ajustes.perfiles.filter(p=>p.activo!==false);
  if(!ps.length)return toast('Primero creá un usuario en Ajustes','bad');
  openModal({title:'Ver como…',html:`<p class="muted small">Mirás la app tal como la ve esa persona.</p><div class="list">${ps.map(p=>`<button class="item" type="button" data-vp="${esc(p.id)}"><div class="t">${esc(p.nombre)}</div><div class="side"><span class="chip">${esc(ROLE_NAME[p.base]||'')}</span></div></button>`).join('')}</div>`,
    onMount(el){el.addEventListener('click',e=>{const b=e.target.closest('[data-vp]');if(!b)return;lsSet('viewAsP',b.dataset.vp);S.tab='';lsSet('tab','');closeModal();refreshAll();});}});
});

/* ===== mi cuenta ===== */
/* frase corta que acompaña «Mi cuenta», una por día (no hace falta pedirle nada al servidor): antes ahí se mostraba la
   dirección del servidor, que quien ya está adentro de la app no necesita ver (esa sí hace falta al crear un usuario nuevo,
   para decirle dónde entrar — eso sigue en Ajustes → Usuarios, sin tocar). */
const FRASES_CUENTA=['Lo que armás hoy, funciona mañana sin que nadie lo note.','Gracias por sostener la red de tanta gente.',
  'Un trabajo prolijo hoy es un problema menos mañana.','Cada cliente conforme empezó con alguien que hizo bien su parte.',
  'No se nota todo lo que hacés, pero se siente.','Firme con lo de hoy, que ya es un montón.','Las cosas bien hechas no vuelven.',
  'Alguien hoy tiene señal gracias a vos.','Paso a paso también se llega.','El trabajo de hoy sostiene la calma de mañana.',
  'Lo simple y bien hecho rinde más que lo apurado.','Buen día para hacer las cosas bien, como siempre.',
  'Cada orden cerrada es un cliente que respira tranquilo.','Gracias por estar, aunque haga calor o llueva.',
  'Lo que hoy parece poco, en un mes es un montón.','Nadie ve el cable bien pasado, pero todos notan el que no anda.',
  'Hecho con cuidado, dura más.','Hoy también sumó lo que hiciste.','La prolijidad de hoy ahorra el dolor de cabeza de mañana.',
  'Un buen día de trabajo no necesita aplausos para valer.','Gracias por bancarte las subidas al poste y las vueltas largas.',
  'Lo que se arregla bien, no vuelve a llamar.','La constancia gana más que el apuro.',
  'Cada casa con señal es una historia que no se ve.','Hoy, como siempre: hacerlo bien es lo que queda.',
  'Gracias por ser la cara de la empresa en la puerta de cada casa.','Lo que cuesta un poco más, después se nota mucho más.',
  'Un día más sosteniendo la conexión de todo un pueblo.'];
function fraseDelDia(){const d=new Date(),ini=new Date(d.getFullYear(),0,0),dia=Math.floor((d-ini)/86400000);return FRASES_CUENTA[((dia%FRASES_CUENTA.length)+FRASES_CUENTA.length)%FRASES_CUENTA.length];}
function openAccount(){
  const me=S.me;if(!me)return;
  openModal({title:'Mi cuenta',html:`<dl class="kv"><dt>Nombre</dt><dd>${esc(me.nombre)}</dd><dt>Usuario</dt><dd class="mono">${esc(me.usuario)}</dd><dt>Tipo</dt><dd>${esc(ROLE_NAME[me.role]||me.role)}</dd></dl>
    <p class="hint" style="margin-top:10px;font-style:italic">"${esc(fraseDelDia())}"</p>
    <form class="form" id="ac-form" novalidate><h3>Cambiar mi clave</h3>
      ${F('Clave actual','ac-act','<input id="ac-act" type="password" autocomplete="current-password">')}
      ${F('Clave nueva','ac-new','<input id="ac-new" type="password" autocomplete="new-password">','Mínimo '+(me.role==='admin'?8:6)+' caracteres.')}
      <div class="actions start"><button class="btn primary" type="submit">Cambiar clave</button></div></form>
    <div class="actions"><button class="btn" type="button" id="ac-reload">Actualizar la app</button><button class="btn danger" type="button" id="ac-out">Cerrar sesión</button></div>`,
    onMount(el){
      $('#ac-form',el).addEventListener('submit',async e=>{
        e.preventDefault();
        try{await NET.api('POST','/api/me/clave',{actual:$('#ac-act',el).value,nueva:$('#ac-new',el).value});toast('Clave cambiada');closeModal();}
        catch(err){toast(err.message||'No se pudo cambiar','bad');}
      });
      $('#ac-reload',el).addEventListener('click',()=>location.reload());
      $('#ac-out',el).addEventListener('click',async()=>{await NET.logout();location.reload();});
    }});
}
$('#roleChip').addEventListener('click',openAccount);

/* ===== pantallas de entrada ===== */
function authCard(inner){$('#view').innerHTML=`<div class="card auth">${inner}</div>`;return $('#view .card');}
function takeFlash(){try{const m=sessionStorage.getItem('yg_msg');sessionStorage.removeItem('yg_msg');return m||'';}catch(e){return '';}}
function showAuth(state,info){
  S.ready=false;tabsHtml='';$('#tabs').innerHTML='';closeModal();
  $('#roleChip').hidden=true;$('#viewAsBtn').hidden=true;
  if(state==='noserver'||state==='offline')return showNoServer(state,info);
  if(state==='setup')return showSetup();
  if(state==='respaldo-vacio')return showRespaldoVacio();
  showLogin(takeFlash(),info&&info.respaldo);
}
/* el servidor de respaldo recién creado todavía no recibió la copia del principal */
function showRespaldoVacio(){
  const el=authCard(`<h2>Servidor de respaldo</h2><p class="muted">Este servidor todavía no recibió la copia del servidor principal. Apenas la reciba (unos minutos después de configurarlo), vas a poder entrar con tu mismo usuario y clave de siempre.</p>
    <div class="actions"><button class="btn primary" type="button" id="rv-retry">Volver a mirar</button></div>`);
  $('#rv-retry',el).addEventListener('click',()=>location.reload());
}
function showNoServer(state,info){
  const off=state==='offline';
  const el=authCard(`<h2>${off?'Sin conexión':'No se pudo conectar'}</h2><p class="muted">${off?'No hay señal y todavía no hay datos guardados en este equipo. Conectate a internet y probá de nuevo.':'No se pudo hablar con el servidor. Revisá la señal e intentá de nuevo.'}</p>
    <div class="actions"><button class="btn primary" type="button" id="ns-retry">Reintentar</button></div>`);
  $('#ns-retry',el).addEventListener('click',()=>location.reload());
}
function showLogin(flash,respaldo){
  const el=authCard(`<h2>Entrar</h2>${flash?`<div class="notice bad">${esc(flash)}</div>`:''}${respaldo&&respaldo.rol==='espera'?'<div class="notice warn"><b>Servidor de respaldo en espera.</b> Entrás con tu mismo usuario y clave, pero solo vas a poder mirar. Si el servidor principal no funciona, el administrador puede activar este desde Ajustes.</div>':''}
    <form class="form" id="lg-form" novalidate>${F('Usuario','lg-user','<input id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false">')}
    ${F('Clave','lg-pass','<input id="lg-pass" type="password" autocomplete="current-password">')}
    <div class="actions"><button class="btn primary" type="submit">Entrar</button></div></form>`);
  $('#lg-user',el).value=lsGet('lastUser')||'';
  setTimeout(()=>{(lsGet('lastUser')?$('#lg-pass',el):$('#lg-user',el)).focus();},50);
  $('#lg-form',el).addEventListener('submit',async e=>{
    e.preventDefault();const u=$('#lg-user',el).value.trim(),p=$('#lg-pass',el).value;
    if(!u||!p)return toast('Escribí tu usuario y tu clave','bad');
    const b=$('button[type=submit]',el);b.disabled=true;b.textContent='Entrando…';
    try{await NET.login(u,p);lsSet('lastUser',u.toLowerCase());location.reload();}
    catch(err){
      b.disabled=false;b.textContent='Entrar';$('#lg-pass',el).value='';
      if(err.code==='device_pending'||err.code==='device_blocked'){
        /* el equipo no está autorizado: se explica en pantalla (no en un aviso que se va) y se da el código para que el administrador lo reconozca */
        const cod=String(NET.did||'').slice(0,6).toUpperCase(),pend=err.code==='device_pending';
        let n=$('#lg-dev',el);if(!n){n=document.createElement('div');n.id='lg-dev';n.className='notice '+(pend?'warn':'bad');$('#lg-form',el).before(n);}
        n.innerHTML=pend?`<b>Este equipo todavía no está autorizado.</b><br>Avisale al administrador que estás intentando entrar desde este equipo (código <span class="mono">${esc(cod)}</span>). Cuando lo apruebe, volvé a tocar «Entrar».`
          :`<b>Este equipo fue bloqueado.</b><br>Consultá con el administrador (código <span class="mono">${esc(cod)}</span>).`;
        return;
      }
      toast(err.network?'No se pudo conectar con el servidor':err.message,'bad');
    }
  });
}
function showSetup(){
  const el=authCard(`<h2>Instalación</h2><p class="muted small">Creá la cuenta del administrador. El código de instalación (16 letras y números, en grupos de 4) te lo dio quien instaló el sistema. Se usa una sola vez.</p>
    <form class="form" id="su-form" novalidate>${F('Código de instalación','su-code','<input id="su-code" autocomplete="off" autocapitalize="characters" spellcheck="false">')}
    ${F('Nombre de la empresa','su-emp','<input id="su-emp" value="YAPUR.NET" autocomplete="off">')}
    ${F('Tu nombre','su-nom','<input id="su-nom" autocomplete="name">')}
    <div class="grid2">${F('Tu usuario','su-user','<input id="su-user" autocomplete="username" autocapitalize="none" spellcheck="false">','Sin espacios.')}${F('Tu clave','su-pass','<input id="su-pass" type="password" autocomplete="new-password">','Mínimo 8 caracteres.')}</div>
    <div class="actions"><button class="btn primary" type="submit">Crear administrador</button></div></form>`);
  $('#su-form',el).addEventListener('submit',async e=>{
    e.preventDefault();const g=i=>$('#'+i,el).value.trim();
    if(!g('su-code')||!g('su-nom')||!g('su-user')||!$('#su-pass',el).value)return toast('Completá todos los datos','bad');
    const b=$('button[type=submit]',el);b.disabled=true;
    try{await NET.setup({codigo:g('su-code'),empresa:g('su-emp'),nombre:g('su-nom'),usuario:g('su-user'),clave:$('#su-pass',el).value});lsSet('lastUser',g('su-user').toLowerCase());location.reload();}
    catch(err){b.disabled=false;toast(err.network?'No se pudo conectar con el servidor':err.message,'bad');}
  });
}

/* ===== aviso de conexión ===== */
let netT=null;
function updateNetBar(){
  const bar=$('#netBar');if(!bar)return;
  clearTimeout(netT);
  if(NET.online){bar.hidden=true;return;}
  netT=setTimeout(()=>{if(NET.online||!S.ready){bar.hidden=true;return;}bar.hidden=false;bar.textContent='Sin conexión con el servidor. Ves los últimos datos guardados y no se puede guardar nada nuevo hasta que vuelva la señal.';},2500);
}
/* botón "atrás" de Android: la envoltura nativa llama a esto; devuelve true si la app se ocupó (cerró una hoja o volvió a la primera pestaña) */
window.yapurBack=function(){
  try{
    if($('#modalRoot').firstChild){closeModal();return true;}
    if(!S.ready)return false;
    const tabs=allowedTabs();
    if(S.tab&&tabs.length&&S.tab!==tabs[0][0]){showTab(tabs[0][0]);return true;}
  }catch(e){console.error(e);}
  return false;
};

/* ===== cambio de día con la app abierta: recalcula plazos y cortes ===== */
let _dia=todayStr();
setInterval(()=>{const t=todayStr();if(t!==_dia){_dia=t;if(S.ready)dataChanged('pagos');}},60000);

/* ===== arranque ===== */
(async function boot(){
  NET.on('kick',()=>location.reload());
  NET.on('me',onMeChanged);
  NET.on('status',updateNetBar);
  NET.on('disp',dispAviso);
  NET.on('respaldo',respBar);
  const devBar=$('#devBar');if(devBar)devBar.addEventListener('click',dispAbrir);
  let st;
  try{st=await NET.init();}catch(e){console.error(e);st={state:'noserver',error:e};}
  if(st.state!=='ready'){showAuth(st.state,st);return;}
  S.me=NET.me;S.realRole=S.me.role;S.uid=S.me.id;S.db=NET.db;
  await new Promise(res=>{
    let first=true;
    S.db.doc('ajustes/general').onSnapshot(snap=>{
      const d=snap.exists?snap.data():null;
      S.ajustes=Object.assign({empresa:'YAPUR.NET',diaVenc:10,perfiles:[],ciclos:null,feriados:null,servicios:null,promesaMax:10,precioInstalacion:PRECIOS_FIJOS_DEF.instalacion,precioReinstalacion:PRECIOS_FIJOS_DEF.reinstalacion,waAuto:true,waActivo:false},d||{},{tecnicos:[]});
      if(!Array.isArray(S.ajustes.perfiles))S.ajustes.perfiles=[];
      deriveTecnicos();delete S.errors.ajustes;S.loaded.ajustes=true;
      if(first){first=false;res();}else{rebuildDerived();onAjustesChanged();}
    },err=>{S.errors.ajustes=err;S.loaded.ajustes=true;if(first){first=false;res();}});
  });
  S.ready=true;refreshAll();updateNetBar();respBar();
  dispRefresh();
  ubicInit().then(jornadaInit,jornadaInit);
  tecAlertaInit();
})();

startUpdateWatch();

/* ===== abrir sin señal: el service worker guarda la pantalla principal (solo con https o en la propia computadora) ===== */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});});
}

</script>
</body>
