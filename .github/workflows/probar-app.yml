name: Probar app FAVL

# Compila la app (APK y AAB) y la prueba en emuladores de Android 16 y Android 11, SIN publicar nada.
# Corre en las ramas de trabajo cuando cambia el código de la app, y a mano desde Actions > "Probar app FAVL" > Run workflow.
# Las capturas de pantalla y el APK de prueba quedan en la corrida (sección "Artifacts").
on:
  push:
    branches-ignore: [main, master]
    paths:
      - 'favl-app/app/**'
      - 'favl-app/tools/build_apk.sh'
      - 'favl-app/tools/probar_en_emulador.sh'
      - '.github/workflows/probar-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Herramientas de Android
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          curl -sSLf -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Compilar (APK y AAB)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FAVL_WORKER_URL: ${{ vars.FAVL_WORKER_URL }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/favl.keystore"
          export KEYSTORE="$RUNNER_TEMP/favl.keystore" BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar" BUILD_TOOLS=36.0.0
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER)) VERSION_NAME="prueba-${GITHUB_RUN_NUMBER}"
          mkdir -p salida
          bash favl-app/tools/build_apk.sh salida/FAVL-prueba.apk salida/FAVL-prueba.aab
          rm -f "$KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: app-de-prueba
          path: salida/
          retention-days: 14

  emulador:
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [36, 30]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-de-prueba
          path: salida

      - name: Habilitar la aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en Android (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash favl-app/tools/probar_en_emulador.sh salida/FAVL-prueba.apk capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-android-api${{ matrix.api }}
          path: capturas/
          retention-days: 14
