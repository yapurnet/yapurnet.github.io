name: Compilar APK FAVL

# Se ejecuta solo cuando cambia el examen original (favl-app/raw), las páginas, la app o las herramientas.
# También se puede lanzar a mano desde la pestaña Actions > "Compilar APK FAVL" > Run workflow.
on:
  push:
    branches: [main, master]
    paths:
      - 'favl-app/raw/**'
      - 'favl-app/www/**'
      - 'favl-app/app/**'
      - 'favl-app/tools/**'
      - '.github/workflows/build-favl-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-favl-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar herramientas de Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign android-sdk-platform-23 zip python3

      - name: Compilar y firmar con la clave de FAVL
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Clave de GitHub que lleva la app para publicar los cambios de instructores (solo abre pedidos en este repositorio). Opcional.
          FAVL_ISSUES_TOKEN: ${{ secrets.FAVL_ISSUES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Faltan los secretos de la clave (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Cargalos en Settings > Secrets and variables > Actions. Ver favl-app/LEEME.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/favl.keystore"
          export KEYSTORE="$RUNNER_TEMP/favl.keystore"
          # El número de versión siempre crece (Android lo exige para actualizar encima).
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="12.${GITHUB_RUN_NUMBER}"
          # Lista de instructores para la actualización automática: la lleva el APK y se publica aparte.
          export INSTR_VERSION="$(date +%s)"
          export FAVL_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          export INSTR_JSON_OUT="$RUNNER_TEMP/favl-instructores.json"
          bash favl-app/tools/build_apk.sh "$RUNNER_TEMP/FAVL-BanderaVuela.apk"
          rm -f "$KEYSTORE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Publicar el APK en la raíz del sitio
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            # Se parte de lo último que hay en GitHub (otra corrida pudo publicar mientras esta compilaba;
            # lo compilado ya está guardado en RUNNER_TEMP, así que no se pierde nada).
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/FAVL-BanderaVuela.apk" FAVL-BanderaVuela.apk
            git add FAVL-BanderaVuela.apk
            # Lista de instructores que las apps instaladas bajan solas al abrirse: examen + cambios hechos desde las apps
            RAW="$(python3 favl-app/tools/pick_raw.py favl-app/raw)"
            node favl-app/tools/extract_instructores.js "$RAW" favl-instructores.json auto favl-app/data/instructores-cambios.json
            git add favl-instructores.json
            if git diff --cached --quiet; then
              echo "El APK no cambió."
              break
            fi
            git commit -m "APK FAVL ${VERSION_NAME}: compilación automática (+ lista de instructores)"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
            echo "Otro proceso publicó al mismo tiempo (intento $intento). Reintento."
            sleep $((intento * 3))
            [ "$intento" -lt 5 ] || { echo "::error::No se pudo publicar el APK después de 5 intentos."; exit 1; }
          done
          {
            echo "### APK FAVL ${VERSION_NAME} publicado"
            echo "Descarga: https://${GITHUB_REPOSITORY_OWNER}.github.io/FAVL-BanderaVuela.apk (puede tardar 1-2 minutos en aparecer)"
            echo "En el celular: Ajustes > Aplicaciones > FAVL Bandera Vuela debe decir **Versión ${VERSION_NAME}**."
          } >> "$GITHUB_STEP_SUMMARY"
